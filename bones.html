<script>
/* ==BONES:ENGINE:BEGIN== */
/* ===========================================================================
   BONES ENGINE: the rules, the people, the bots, the back room, the Book.
   Pure calculation: no DOM, no clock, no unseeded randomness. Runs unchanged in
   Node's vm. Attaches itself as Game.Engine and nothing else.

   ---------------------------------------------------------------------------
   THE CONTRACT (for the UI)
   ---------------------------------------------------------------------------
   The night state S is plain JSON: save it with JSON.stringify, resume with
   JSON.parse; the copy plays on exactly as the original would. All dice come
   from a seeded generator kept in S.rng: same seed + same actions = same
   night, byte for byte. Never edit S yourself; only call the functions.

   Seats: the human is always seat 0; the people sit at 1..n, clockwise in
   turn order (seat 1 is "on your left"). Faces are 1..6. Ones are wild (they
   count as any face bid) unless the table's house rule is Straight; then 1 is
   an ordinary face and may be bid. Bid order: (q,f) beats (q0,f0) when
   q > q0, or q == q0 and f > f0.

   ENTRY POINTS
     Engine.newNight({ seed, daily, book, tricks }) -> S
         seed: any string/number (default 'bones'); daily: 'YYYY-MM-DD' (the
         seed becomes Engine.dailySeed(daily)); book: the persisted Book (so
         bots remember how you bluff, and Reading Glasses can count habits
         already seen); tricks: ids held from the start (tests / sims only).
     Engine.act(S, action) -> events        the one way to change S.
         Legal actions by phase (S.phase / view.phase):
           'choose': {t:'sit', i}            sit at card i of Engine.options(S)
                     {t:'walk'}              Last Call only: go home with your cash
           'table' wait 'turn':  {t:'bid', q, f} | {t:'liar'} | {t:'spot'}
                                 {t:'liar', double:true}  (Double or Nothing)
                                 {t:'use', id:'nod'}
                                 {t:'use', id:'slowroll', dice?:[indices]} (all if omitted)
                                 {t:'use', id:'palm', die, face}
           'table' wait 'ready': {t:'go'} (also the two uses: slowroll, palm)
                      ('ready' only happens when you hold Slow Roll and are
                       not the opener: your chance to re-roll before bid 1)
           'table' wait 'next':  {t:'next'}  start the next round (after a reveal)
           'shop':   {t:'buy', i} | {t:'sell', id} | {t:'reroll'} | {t:'leave'}
           'over':   nothing.
         An illegal action changes nothing and returns
         [{t:'error', msg}]. Every other batch ends with {t:'wait', need},
         need = 'turn'|'ready'|'next'|'choose'|'shop'|'over': what the
         human must do now. There is never anything left to "run".
     Engine.sit(S, i) = act(S, {t:'sit', i}).
     Engine.advance(S) -> events   runs bots if anything is pending (after a
         resume it is always a no-op that returns [{t:'wait', need}]).
     Engine.playNight(seed, policy, opts) -> { S, events }   drives a whole
         night: policy(S, view, legal, Engine) returns the next action.
         opts: { daily, book, tricks, keepEvents }.
     Engine.basicPolicy   a plain by-the-Count player (a usable policy).

   READING (never mutate S)
     Engine.view(S) -> {
       v, phase, hour (0..4), hourName, cash, streak, seed, daily, ending,
       tricks: [{ id, name, text, rarity, kind, usable, asleep }],
               usable = can be used right now; asleep = a dice trick at Last
               Call (Loretta counts the bones: dice tricks do not work there)
       options: (phase 'choose') same as Engine.options(S),
       shop:    (phase 'shop') same as Engine.shopView(S),
       table: null | {
         hour, kind:'easy'|'rich'|'last', rule:{id,name,text}|null, buyIn,
         ante, pot, onTab, round (1..), wait, turn (seat), opener (seat),
         wild (bool), faces:[...biddable], total (dice on the table),
         seats: [{ seat, id ('me' or person id), name, isMe, dice (count),
                   start (starting count), out, lastBid:{q,f}|null,
                   shown:[{i, face, why:'open'|'mirror'|'cornered'}],
                   ledger: 'bluffs about 1 bid in 3' | null }],
         myDice: [faces] | null (null while you bid blind),
         myFixed: [die indices]: your fixed 1s (Shaved Die / Hot Hand), wild
                  only for your own bids,
         blind (bool), bid: {who, id, q, f} | null,
         history: [{ who, id, q, f, habit:{i, text, line, underline}|null }],
         ones: number|null (Bar Mirror), nod: {q, f, truth}|null,
         count: Count of the bid in front of you (0..1) | null,
         last: null | { reveal, readout, lines } (the previous round's
               reveal and readout events, until the next round starts)
       }
     }
       The view never holds another player's hidden dice, any person's
       hidden parameters or which habit is a tell (Reading Glasses' underline
       and Lyman's Ledger's phrase are the only exceptions, granted by tricks).
     Engine.options(S) -> [{ i, kind, hour, hourName, seats, dice, buyIn, pot,
         ante, rule:{id,name,text}|null, people:[public person], affordable,
         viaTab }]   (one card at Last Call; [] outside phase 'choose')
     Engine.legal(S) -> { need, mustBid, canBid, canLiar, canSpot,
         minBid:{q,f}|null, maxQ, faces, uses:[ids], canGo, canNext,
         sit:[i...], canWalk, buy:[i...], sell:[ids], canReroll,
         rerollPrice, canLeave }
     Engine.isLegalBid(S, q, f) -> bool
     Engine.count(S, q, f) -> P(at least q f's on the table) from your cup and
         what tricks showed you, other dice fair. Exact. null off-table.
         (q,f) equal to the bid in front of you is judged as its bidder's bid
         (your fixed 1s are plain for it); any other (q,f) as your own raise.
     Engine.countExact(S, q, f) -> P(exactly q), same footing (for Spot On).
     Engine.shopView(S) -> { hour, offers:[{ i, id, name, text, rarity, kind,
         price, affordable }|null], held:[{ id, name, text, sell }],
         slots: 5, rerollPrice, cash }
     Engine.summary(S) -> facts for the ledger and the end screen (see fn).
     Engine.shareLine(S) -> 'Bones · 2026-11-21 · beat the house · $2,340 · 🎲🎲⬛🎲👑'
     Engine.column(S) -> { headline, body, byline }  Pearl's column, templated.
     Engine.columnFacts(S) -> plain text account of the night (for a prompt).
     Engine.talkFacts(S, events) -> plain text account of one reveal.
     Engine.dailySeed('2026-11-21') -> 'daily:2026-11-21'

   THE BOOK (persisted by the UI across nights)
     Engine.bookApply(book|null, events) -> new book (pure; feed it every
         batch of events). Engine.bookPage(book, personId, S?) -> {
         id, name, met, nights, bids, bluffs, won, lost, head,
         rows:[{ i, habit, n, bluff, straight, text, underline }],
         quiet:{ n, bluff, straight }  (bids with no habit shown),
         truth: phrase|null }   (underline / truth only via S's tricks)

   DATA: Engine.PEOPLE (public: id, name, first, age, pronouns, look, voice,
   habits), Engine.TRICKS, Engine.HOUSE_RULES, Engine.HOURS, Engine.VERSION.

   EVENTS (in order; each carries what it needs to be drawn)
     {t:'hour', hour, hourName, options}              a new hour; cards to pick
     {t:'sit', hour, kind, night, rule, buyIn, ante, pot, onTab,
               seats:[{seat, id, name, dice}]}
     {t:'pay', amount (signed), why, cash}            every change of cash; why =
         'buyin'|'won'|'lost'|'streak'|'spot'|'sticky'|'snake'|'pot'|'refund'|
         'buy'|'sell'|'reroll'
     {t:'roll', round, opener, openerId, mine:[faces]|null, counts:[per seat],
               open:[{seat, face}], blind}            a round starts
     {t:'look', mine}                                 a blind opener sees the cup
     {t:'trick', id, ...}                             a trick did something:
         shaved/loaded/hothand {die} · extrabone {dice} · rabbit {saved}
         slowroll {dice, mine} · palm {die, face, mine} · mirror {seat, who, die, face}
         barmirror {ones} · nod {q, f, truth} · cornered {shown:[{seat,die,face}]}
         sticky {amount} · sidebet {} · housemoney {extra} · snake {amount}
         tab {buyIn} · honest {who, n} · double {who, n} · close {} · lastword {}
     {t:'bid', who, id, name, q, f, habit:{i, text, line, underline}|null}
     {t:'call', who, id, name, kind:'liar'|'spot', on:{who, id, q, f}}
     {t:'reveal', kind, caller, bidder, q, f, wild, count, good, exact,
               cups:[{who, id, dice}]}
     {t:'lose', who, id, n, left} · {t:'gain', who, id, left}
     {t:'out', who, id, name, place}
     {t:'readout', bids:[{who, id, name, q, f, held, p, bluff,
               habit:i|null, text|null}]}    "what they had": held = matching
               dice in the bidder's cup; p = P(true) from the bidder's own cup
     {t:'bark', who, id, name, text}                  a scripted one-liner
     {t:'tableEnd', hour, kind, place, won, payout, refund, rounds, people,
               cash}
     {t:'shop', hour, offers:[...shopView offers], rerollPrice}
     {t:'buy', id, price} · {t:'sell', id, price} · {t:'reroll', price, offers}
     {t:'nightEnd', ending:'house'|'cleaned'|'walked'|'bust', cash, share}
     {t:'wait', need}                                 always last

   MONEY (exact rules; see design 1-2)
     ante = round(buyIn x 0.15) (x2 under Double ante; 0 at Last Call, where
     only the pot moves). When you are caller or bidder in a Liar call, or
     you call Spot On, the loser pays the winner one ante (never below $0).
     A win pays ante x (1 + min(streak, 3)), streak = wins in a row before it.
     A correct Spot On pays 3 antes (6 with Side Bet) plus the streak bonus.
     A bot's Spot On on your bid costs or pays you nothing. Win the table:
     the pot (seats x buy-in; +25% House Money; minus the buy-in if on a Tab).
     2nd of 4: your buy-in back. Next round's opener: whoever lost the
     challenge (after a correct Spot On, the caller); if out, the next seat.

   THE NIGHT (tuned by tests/bones-sim.cjs; see Engine.HOURS)
     $100 to start. 9 PM, 10 PM, 11 PM, Midnight: two tables each (easy 3
     seats; rich about double the buy-in, 4 seats from 10 PM, usually a house
     rule). Buy-ins easy/rich: 20/40, 40/80, 80/160, 160/320. After every
     table, the back room. Leaving it short of the cheaper buy-in (and no
     Tab) = 'bust'. Last Call: Loretta + Curtis, 3 seats, 5 dice, needs $500,
     buy-in = all your cash, win = x3 ('house'), lose = $0 ('cleaned'); short
     of $500, or {t:'walk'}, = 'walked'. Loretta counts the bones: DICE tricks
     (Shaved Die, Loaded Six, Extra Bone, Rabbit's Foot, Slow Roll, Palm, Hot
     Hand) do not work at Last Call; info, money and manner tricks do.

   TRICK RULINGS (where the one-line text needs a decision)
     Shaved Die / Hot Hand: the fixed 1 is wild only for your own bids; on
       anyone else's bid it is a plain 1 (view.table.myFixed marks it).
       With Shaved + Loaded, die 0 is the 1, die 1 the 6.
     Slow Roll: {dice:[...]} re-rolls just those; fixed dice land as fixed.
     Palm: any face 1..6 on any die; a palmed die is no longer fixed.
     Rabbit's Foot takes 1 off the first loss at a table (Sudden 2 -> 1).
     Double or Nothing is chosen per call ({t:'liar', double:true}); it and
       Honest Face double the loss (4 under Sudden).
     Close Enough: a Liar call on your bid that finds exactly q-1.
     Last Word: you stay in with 1 die, once per table (after Rabbit's Foot).
     Hot Hand follows any challenge you win (Liar or Spot On). Snake Eyes pays
       on every roll you see (a Slow Roll included). Sell = half the price
       paid. Friends Rates discounts tricks, not rerolls. A Tab is spent when
       you sit on it. Reading Glasses counts sightings in the Book plus
       tonight. Loretta's Nod lasts the round (Palm cancels it).

   Engine._sim exposes the hidden side (people's parameters, the odds) for
   tests and the balance sim. The UI must not use it.
   =========================================================================== */

  // ----- seeded randomness (mulberry32, as Lock-In; the state lives in S.rng) -----
  function rnd(S) {
    S.rng = (S.rng + 0x6D2B79F5) | 0;
    let t = S.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const ri = (S, n) => Math.floor(rnd(S) * n);
  function shuffle(S, list) { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(S, i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function hash(text, salt) { let h = 2166136261 ^ (salt | 0); const t = String(text || ''); for (let i = 0; i < t.length; i++) h = Math.imul(h ^ t.charCodeAt(i), 16777619) >>> 0; return h >>> 0; }
  const clone = o => JSON.parse(JSON.stringify(o));
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const sum = a => a.reduce((x, y) => x + y, 0);
  const money = n => '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  // ----- a round -----
  function rollMine(S, T, ev, hot) {

  // ----- the bots -----
  // How often seat j's revealed bids were bluffs, as seat s estimates it.

  function botMove(S, T, s) {

  // ----- challenges -----
  function loseDice(S, T, s, n, ev) {

  function tableEnd(S, T, place, ev) {

  function endNight(S, ending, ev) {

  }

  // ----- the back room -----
  function price(S, id, hour) {

  // ----- driving -----

  function legal(S) {

      tables: S.log.map(t => ({ hour: t.hour, hourName: HOURS[t.hour].name, kind: t.kind, rule: t.rule, place: t.place, won: t.won, payout: t.payout, refund: t.refund, rounds: t.rounds, people: t.people.map(id => P[id].name) })),
      tablesWon: S.log.filter(t => t.won).length, challengesWon: st.won, challengesLost: st.lost, liarsCaught: st.caught, timesCaught: st.caughtBy,
      spotsHit: st.spots, spotsMissed: st.spotMiss, bids: st.bids, bluffs: st.bluffs, bestStreak: st.bestStreak, maxCash: st.maxCash, rounds: st.rounds, tricksBought: st.bought.slice(), tricksHeld: S.tricks.map(t => t.id)
    };
  }
  function shareLine(S) {
    const marks = S.log.map(t => t.kind === 'last' ? (t.won ? '👑' : '💀') : t.won ? '🎲' : '⬛').join('');
    const tail2 = S.ending === 'walked' ? '🚶' : S.ending === 'bust' ? '🕳️' : '';
    return ['Bones', S.daily || 'night ' + S.seed, S.ending ? ENDING[S.ending] : 'still playing', money(S.cash), marks + tail2].join(' · ');
  }
  const pickH = (S, salt, list) => list[hash(S.seed + '|' + salt, 11) % list.length];
  const word = n => ['no', 'one', 'two', 'three', 'four', 'five', 'six'][n] || String(n);
  function column(S) {
    const s = summary(S), best = S.log.reduce((a, t) => !a || t.payout > a.payout ? t : a, null);
    const victims = [].concat(...S.log.map(t => t.caught)), nem = [].concat(...S.log.map(t => t.caughtBy));
    const most = list => { const c = {}; list.forEach(id => { c[id] = (c[id] || 0) + 1; }); return Object.keys(c).sort((a, b) => c[b] - c[a] || (a < b ? -1 : 1))[0]; };
    const v = most(victims), n = most(nem);
    const heads = {
      house: ['VISITOR TAKES LORETTA\'S TABLE', 'HOUSE FALLS AT LAST CALL', 'LOW WATER BANK BROKEN, SAYS OWNER', 'STRANGER WALKS OUT RICHER THAN THE HOUSE'],
      cleaned: ['ALL IN, ALL GONE', 'LAST CALL CLAIMS ANOTHER', 'LORETTA KEEPS THE HOUSE', 'BIG STACK MEETS BIGGER CUP'],
      walked: ['VISITOR GOES HOME ON FOOT', 'NO SEAT AT LORETTA\'S TABLE', 'A QUIET NIGHT AT THE LOW WATER', 'SHORT OF THE MARK BY CLOSING'],
      bust: ['BONES PICKED CLEAN', 'VISITOR BUSTED BEFORE MIDNIGHT', 'EARLY NIGHT FOR A NEWCOMER', 'CUPS UP, POCKETS OUT']
    };
    const end = S.ending || 'walked';
    const headline = pickH(S, 'head', heads[end]);
    const open = pickH(S, 'open', [
      `A visitor sat down at the Low Water with ${money(START_CASH)} and a cup of bones.`,
      `The dice were loud at the Low Water last night, and one newcomer was in the middle of it.`,
      `Ask anyone who was there: the visitor in the corner seat played ${word(Math.min(6, s.tables.length))} tables and never once looked bored.`
    ]);
    const parts = [open];
    if (s.tablesWon) parts.push(pickH(S, 'won', [`The visitor won ${word(s.tablesWon)} of ${word(s.tables.length)} tables`, `Of ${word(s.tables.length)} tables, ${word(s.tablesWon)} went the visitor's way`]) + (best && best.won ? `, the best of them the ${HOURS[best.hour].name} ${best.kind === 'rich' ? 'big table' : best.kind === 'last' ? 'last table' : 'table'} for ${money(best.payout)}.` : '.'));
    else parts.push(pickH(S, 'nowin', ['Not one table went the visitor\'s way.', 'The tables were not kind.']));
    if (v) parts.push(pickH(S, 'v', [`${P[v].name} was caught bluffing more than once and will hear about it at church.`, `${P[v].first} ${P[v].habits[P[v].tell]}, and this reporter suspects the visitor noticed.`, `${P[v].name} learned the hard way that the visitor counts.`]));
    if (n) parts.push(pickH(S, 'n', [`${P[n].name}, for the record, saw through the visitor's stories.`, `${P[n].first} called the visitor a liar and was right to.`]));
    if (s.spotsHit) parts.push(s.spotsHit === 1 ? 'Once the visitor called a bid spot on, and was right.' : `${word(s.spotsHit)[0].toUpperCase() + word(s.spotsHit).slice(1)} times the visitor called a bid spot on, and was right.`);
    if (s.tricksBought.length) parts.push(pickH(S, 'tr', [`Curtis Pruett reports selling the visitor a ${TRICK[s.tricksBought[0]].name} in the back room, at a fair price, he says.`, `There was business in the back room too: ${s.tricksBought.map(id => TRICK[id].name).slice(0, 3).join(', ')}.`]));
    const close = {
      house: [`Then Loretta dealt her own table, and lost it. "Well, hon," she said. The visitor left with ${money(s.cash)}.`, `At Last Call the visitor beat Loretta Gaddis and Curtis Pruett both, and walked out with ${money(s.cash)}.`],
      cleaned: [`At Last Call the visitor pushed everything in against Loretta and went home with the story and nothing else.`, `Loretta took the lot at Last Call. "Bring what you've got, hon," she had said. The visitor did.`],
      walked: [`Short of the money for Loretta's table, the visitor went home with ${money(s.cash)}.`, `The visitor walked home at closing with ${money(s.cash)} and, one hopes, a lesson.`],
      bust: [`By ${HOURS[Math.min(S.hour, 4)].name} the visitor could not cover a buy-in and went home early.`, `The money ran out around ${HOURS[Math.min(S.hour, 4)].name}. The bar wishes the visitor better luck.`]
    };
    parts.push(pickH(S, 'close', close[end]));
    return { headline, body: parts.join(' '), byline: 'By Pearl Gentry' };
  }
  // 'Colt twice, Nadine' from a list of ids.
  const tally = ids => { const c = {}; ids.forEach(id => { c[id] = (c[id] || 0) + 1; }); return Object.keys(c).map(id => P[id].first + (c[id] === 1 ? '' : c[id] === 2 ? ' twice' : ' ' + word(c[id]) + ' times')).join(', '); };
  const bidText = (q, f) => word(q) + ' ' + f + (q === 1 ? '' : 's');
  function columnFacts(S) {
    const s = summary(S), lines = [`Night ${S.daily || S.seed}. Started with ${money(START_CASH)}. Ending: ${s.endingText || 'not over'}, cash ${money(s.cash)}.`];
    S.log.forEach(t => lines.push(`${HOURS[t.hour].name} ${t.kind} table${t.rule ? ' (' + RULE[t.rule].name + ')' : ''} with ${t.people.map(id => P[id].name).join(', ')}: finished ${t.place === 1 ? 'first' : 'place ' + t.place}${t.payout ? ', won ' + money(t.payout) : ''}${t.refund ? ', got the buy-in back' : ''}; ${t.rounds} rounds.` + (t.caught.length ? ` Caught bluffing: ${tally(t.caught)}.` : '') + (t.caughtBy.length ? ` Caught the visitor: ${tally(t.caughtBy)}.` : '') + (t.spots ? ` Spot On hits: ${t.spots}.` : '')));
    lines.push(`Challenges won ${s.challengesWon}, lost ${s.challengesLost}; best streak ${s.bestStreak}; bluffs ${s.bluffs} of ${s.bids} bids; peak cash ${money(s.maxCash)}.`);
    if (s.tricksBought.length) lines.push('Tricks bought: ' + s.tricksBought.map(id => TRICK[id].name).join(', ') + '.');
    return lines.join('\n');
  }
  function talkFacts(S, events) {
    const call = events.find(e => e.t === 'call'), rev = events.find(e => e.t === 'reveal'), ro = events.find(e => e.t === 'readout');
    if (!call || !rev) return '';
    const nm = e => e.id === 'me' ? 'the visitor' : P[e.id].name;
    const lines = [];
    const ids = rev.cups.map(c => c.id).filter(id => id !== 'me');
    ids.forEach(id => lines.push(`${P[id].name} (${P[id].age}): ${P[id].voice}`));
    if (ro) ro.bids.forEach(b => lines.push(`${nm(b)} bid ${bidText(b.q, b.f)} holding ${b.held}${b.bluff ? ' (a bluff)' : ''}${b.text ? '; ' + (b.id === 'me' ? '' : P[b.id].first + ' ' + b.text) : ''}.`));
    lines.push(`${nm(call)} called ${call.kind === 'liar' ? 'Liar' : 'Spot On'} on ${nm(call.on)}'s ${bidText(call.on.q, call.on.f)}. There were ${rev.count}.`);
    events.filter(e => e.t === 'lose').forEach(e => lines.push(`${nm(e)} lost ${word(e.n)} ${e.n === 1 ? 'die' : 'dice'} (${e.left} left).`));
    events.filter(e => e.t === 'gain').forEach(e => lines.push(`${nm(e)} won a die back.`));
    events.filter(e => e.t === 'out').forEach(e => lines.push(`${nm(e)} is out of the game.`));
    return lines.map(l => l[0].toUpperCase() + l.slice(1)).join('\n');
  }

  // ----- a plain by-the-Count player, and a whole-night driver -----
  function basicPolicy(S, v, L, E) {
    if (S.phase === 'choose') { if (L.canWalk && !L.sit.length) return { t: 'walk' }; const o = v.options; const rich = o.find(c => c.kind === 'rich' && c.affordable && S.cash >= c.buyIn * 2); return { t: 'sit', i: rich ? rich.i : L.sit[0] }; }
    if (S.phase === 'shop') return { t: 'leave' };
    if (L.need === 'next') return { t: 'next' };
    if (L.need === 'ready') return { t: 'go' };
    const b = v.table.bid;
    if (b && count(S, b.q, b.f) < 0.38) return { t: 'liar' };
    if (b && countExact(S, b.q, b.f) > 0.5) return { t: 'spot' };
    let best = null;
    for (let q = L.minBid ? L.minBid.q : 1; L.minBid && q <= L.maxQ && !best; q++) for (const f of L.faces) if (isLegalBid(S, q, f) && count(S, q, f) >= 0.5 && (!best || count(S, q, f) > count(S, best.q, best.f))) best = { q, f };
    if (best) return { t: 'bid', q: best.q, f: best.f };
    if (L.mustBid) return { t: 'bid', q: L.minBid.q, f: L.minBid.f };
    return { t: 'liar' };
  }
  function playNight(seed, policy, opts) {
    opts = opts || {};
    const S = newNight(Object.assign({}, opts, { seed }));
    const events = [];
    for (let guard = 0; S.phase !== 'over'; guard++) {
      if (guard > 20000) throw new Error('playNight: no progress');
      const a = (policy || basicPolicy)(S, view(S), legal(S), Engine);
      const ev = act(S, a);
      if (ev[0] && ev[0].t === 'error') throw new Error('policy made an illegal move: ' + JSON.stringify(a) + ' (' + ev[0].msg + ')');
      if (opts.keepEvents) events.push(...ev);
    }
    return { S, events };
  }

  const Engine = {
    VERSION, PEOPLE, TRICKS, HOUSE_RULES: HOUSE_RULES.map(r => Object.freeze(r)), HOURS: clone(HOURS), START_CASH, SLOTS,
    newNight, options, sit: (S, i) => act(S, { t: 'sit', i }), act, advance, legal, isLegalBid, count, countExact,
    view, shopView, bookApply, bookPage, summary, shareLine, column, columnFacts, talkFacts, dailySeed, playNight, basicPolicy,
    // For tests and the balance sim only: the hidden side of the people and the odds. Not for the UI.
    _sim: { person: id => P[id] ? clone(P[id]) : null, tail, pmf, price: (S, id, h) => price(S, id, h), estBluff: (S, j) => estBluff(S, S.table, j), TELL, BLUFF_P }
  };
  Game.Engine = Engine;
})();
