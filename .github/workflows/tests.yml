# The whole test suite (node tests/run.cjs: the town content check, then
# every tests/*.test.cjs in headless Chromium) on every push and pull request.
# Playwright is installed outside the checkout and found through NODE_PATH:
# the game is one file with no build and no package.json, and
# tests/constraints.test.cjs checks that there is none.
# Wave 36: four shards (tests/run.cjs --shard i/4, balanced by its weight
# table), two files at a time in each; Playwright pinned and cached; a push
# and the pull request for the same branch share one concurrency group, so
# the newer run cancels the older; the run log and any screenshots
# ($UI_SHOTS, tests/ui-fixes.test.cjs) are uploaded when a shard fails.
# The full serial run and the 21-day simulator are in nightly.yml.
name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # The version installed where the suite is written (node -e "console.log(require('playwright/package.json').version)").
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  test:
    name: tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Playwright and Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/pw/node_modules
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright and Chromium (outside the checkout)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          mkdir -p pw && cd pw
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # Browser and package from the cache; the system libraries are not cached.
            npx --no-install playwright install-deps chromium
          else
            npm init -y > /dev/null
            npm i --no-save "playwright@${PLAYWRIGHT_VERSION}"
            npx --no-install playwright install --with-deps chromium
          fi
          node -e "console.log('playwright', require('playwright/package.json').version)"
      - name: Run the tests (shard ${{ matrix.shard }} of 4)
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          UI_SHOTS: ${{ runner.temp }}/shots
        run: node tests/run.cjs --shard ${{ matrix.shard }}/4 -j 2 2>&1 | tee "${{ runner.temp }}/run.log"
      - name: Time per file
        if: always()
        shell: bash
        run: |
          {
            echo "### Shard ${{ matrix.shard }}/4: time per file, slowest first"
            echo '```'
            sed -n '/^Time per file, slowest first:/,$p' "${{ runner.temp }}/run.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the run log and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/run.log
            ${{ runner.temp }}/shots/
          if-no-files-found: ignore
          retention-days: 14
