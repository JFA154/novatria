<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- As the other games at the Low Water: the page may talk only to the Anthropic API and run only its own inline code. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.anthropic.com; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#17130f">
<meta name="description" content="Bones: liar's dice at the Low Water. The math says one thing. Their face says another.">
<title>Bones</title>
<style>
/* ===== Tokens (as lockin.html / Lock-In, plus the table's felt and ivory) ===== */
:root {
  --read-font: Georgia, "Times New Roman", serif;
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tap: 44px;
  --radius: 8px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --die: 52px; --tray: 19px; --seat-face: 48px;
  --ivory-1: #fdf8ec; --ivory-2: #efe3c8; --ivory-3: #dccaa5; --pip: #241a12; --wild-pip: #b23a26;
}
:root, :root[data-theme="dark"] {
  --bg: #17130f; --surface: #1f1a15; --surface-2: #2a241d; --text: #ece4d5; --muted: #a99e8b; --faint: #958b79;
  --border: #3a3229; --field: #7a6f5d; --accent: #d2aa69; --accent-ink: #1b150e; --danger: #e2917a; --good: #9fbf8a; --focus: #e9c27f;
  --person-1: #74493a; --person-2: #57613d; --person-3: #3e5969; --person-4: #7a5f2d; --person-5: #604459; --person-6: #3d6057;
  --felt: #233029; --felt-edge: #3d2f22; --night: #0d1016;
  --felt-hi: #2d3e34; --shadow: rgba(0, 0, 0, .5); --down-1: #6a5038; --down-2: #3a2b1e;
  color-scheme: dark;
}
:root[data-theme="parchment"] {
  --bg: #f4ecda; --surface: #ede3cc; --surface-2: #e4d7bb; --text: #2a2217; --muted: #57492f; --faint: #6a5d45;
  --border: #cdbd9b; --field: #857559; --accent: #815219; --accent-ink: #fbf6ea; --danger: #9c3d28; --good: #3f6a2c; --focus: #815219;
  --person-1: #dbb4a0; --person-2: #c6c89e; --person-3: #b3c5cd; --person-4: #dfc48b; --person-5: #d3b7c4; --person-6: #aecabd;
  --felt: #c9d3bd; --felt-edge: #a98d63; --night: #cfd3dc;
  --felt-hi: #d6dfcb; --shadow: rgba(70, 45, 10, .28); --down-1: #8a6a48; --down-2: #5e452c;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 var(--ui-font); -webkit-text-size-adjust: 100%; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.visually-hidden { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.face { display: block; width: 100%; height: 100%; }
.face .face-bg { fill: var(--person-1); }
.face[data-hue="2"] .face-bg { fill: var(--person-2); } .face[data-hue="3"] .face-bg { fill: var(--person-3); } .face[data-hue="4"] .face-bg { fill: var(--person-4); }
.face[data-hue="5"] .face-bg { fill: var(--person-5); } .face[data-hue="6"] .face-bg { fill: var(--person-6); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 16px;
  border: 1px solid var(--field); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.big { min-height: 56px; padding: 0 22px; border-radius: 12px; font: 700 21px/1.1 var(--read-font); letter-spacing: .01em; }
.input { min-height: var(--tap); width: 100%; padding: 8px 12px; border: 1px solid var(--field); border-radius: var(--radius); background: var(--surface); font-size: 16px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg .btn { flex: 1 1 auto; }
.seg .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { color: var(--muted); font-size: 14px; }
.err { color: var(--danger); }
.check { display: flex; align-items: center; gap: 8px; min-height: var(--tap); font-weight: 400; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.linkbtn { min-height: var(--tap); padding: 0 4px; border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 14px; }

/* ===== Frame and screens ===== */
#app { height: 100%; height: 100dvh; }
.screen { display: none; height: 100%; }
.screen.active { display: block; }
.page { overflow-y: auto; overscroll-behavior: contain; }
.page-in { max-width: 720px; margin: 0 auto; padding: 12px calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal)); }
.topbar { position: sticky; top: 0; z-index: 5; flex: none; display: flex; align-items: center; gap: 6px; min-width: 0; padding: calc(6px + var(--sat)) calc(8px + var(--sar)) 6px calc(12px + var(--sal)); border-bottom: 1px solid var(--border); background: var(--bg); }
.topbar .title { font: 600 20px/1.1 var(--read-font); white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; min-height: var(--tap); }
.topbar .hour { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar .hour .hs { display: none; }
@media (max-width: 380px) { #btn-sound { display: none; } } /* sound stays in the menu */
@media (max-width: 400px) { .topbar { gap: 4px; } .topbar .cash { font-size: 16px; } .topbar .hour .hl { display: none; } .topbar .hour .hs { display: inline; } }
.topbar .sp { flex: 1; }
.topbar .btn { padding: 0 9px; min-width: 44px; }
.topbar .btn svg { width: 20px; height: 20px; display: block; }
.topbar .booklbl { margin-left: 4px; }
@media (max-width: 420px) { .topbar .booklbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
.cash { font: 700 18px/1 var(--ui-font); font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; padding: 4px 2px; border-radius: 6px; transition: color .3s; }
.cash[data-flash="good"] { color: var(--good); }
.cash[data-flash="danger"] { color: var(--danger); }
.streak { min-width: 28px; padding: 2px 6px; border: 1px solid var(--field); border-radius: 11px; font: 700 12px/1.3 var(--ui-font); color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.streak[data-hot] { border-color: var(--accent); color: var(--accent); }
h1, h2, h3 { font-family: var(--read-font); }
.kicker { margin: 18px 0 8px; font: 700 12px/1.2 var(--ui-font); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* ===== Home ===== */
.home { max-width: 640px; margin: 0 auto; padding: calc(28px + var(--sat)) calc(16px + var(--sar)) calc(32px + var(--sab)) calc(16px + var(--sal)); }
.home h1 { margin: 0; font: 700 64px/1 var(--read-font); letter-spacing: .02em; }
.home .tagline { margin: 10px 0 18px; font: italic 19px/1.4 var(--read-font); color: var(--muted); }
.home .tagline b { color: var(--text); font-weight: 400; }
.hero-dice { --s: 40px; display: flex; gap: 9px; margin: 18px 0 20px; min-height: 44px; }
.home .cta { display: grid; gap: 8px; margin: 0 0 6px; }
.home .cta .btn.big { width: 100%; }
.home .cta-sub { margin: 2px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
.home .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.home .pair .btn.big { font-size: 18px; padding: 0 10px; }
.card { margin: 14px 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.card > h2, details.card > summary { margin: 0 0 8px; font: 700 13px/1.3 var(--ui-font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
details.card > summary { cursor: pointer; display: flex; align-items: center; min-height: 28px; margin: 0; list-style-position: inside; }
details.card[open] > summary { margin-bottom: 10px; }
.how ol { margin: 0; padding: 0 0 0 20px; }
.how li { margin: 0 0 7px; line-height: 1.4; }
.daily-line { margin: 0 0 10px; }
.stat-line { margin: 0 0 4px; font: 600 18px/1.35 var(--read-font); }
.ranks { display: flex; gap: 4px; margin: 8px 0 2px; }
.ranks span { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
.ranks span[data-on] { background: var(--accent); }
.book-strip { display: flex; margin: 4px 0 10px; }
.book-strip .mini { width: 34px; height: 34px; margin-right: -6px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--surface); }
.field { display: grid; gap: 6px; margin: 0 0 14px; }
.field > label, .field > .label { font-weight: 600; }
.field .help { color: var(--muted); font-size: 14px; }
.others { margin: 20px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
.others a { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 6px; }

/* ===== Choose a table ===== */
.hourhead { margin: 6px 0 2px; font: 700 30px/1.15 var(--read-font); }
.hourhead small { color: var(--accent); font-weight: 700; }
.hours { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin: 10px 0 12px; }
.hours .h { display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border-radius: 8px; font: 600 11px/1.2 var(--ui-font); color: var(--faint); text-align: center; letter-spacing: .02em; }
.hours .h i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--field); }
.hours .h[data-state="won"] i { background: var(--good); border-color: var(--good); }
.hours .h[data-state="lost"] i { background: var(--danger); border-color: var(--danger); }
.hours .h[data-state="now"] { color: var(--accent); background: var(--surface); }
.hours .h[data-state="now"] i { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.cards { display: grid; gap: 12px; }
@media (min-width: 760px) { .cards[data-n="2"] { grid-template-columns: 1fr 1fr; } }
.tcard { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
.tcard[data-kind="rich"] { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.tcard[data-kind="last"] { border-color: var(--accent); background: linear-gradient(160deg, var(--surface-2), var(--surface)); }
.tcard[data-off] { opacity: .62; }
.tcard-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tcard-head h2 { margin: 0; font: 700 22px/1.2 var(--read-font); }
.tcard-head .money { font: 700 20px/1 var(--ui-font); color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tcard .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 14px; }
.tcard .facts b { color: var(--text); font-variant-numeric: tabular-nums; }
.people { display: grid; gap: 6px; }
.person { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; min-height: 48px; padding: 4px 6px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; }
.person:hover { background: var(--surface-2); }
.person .mini { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
.person .nm { font: 600 16px/1.2 var(--read-font); }
.person .bk { font-size: 13px; color: var(--muted); line-height: 1.3; }
.person .bk[data-new] { font-style: italic; color: var(--faint); }
.rule { display: grid; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.rule b { font: 700 13px/1.2 var(--ui-font); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tcard .why { color: var(--danger); font-size: 14px; }
.tcard .line { font: italic 18px/1.35 var(--read-font); }
.held-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }

/* ===== The table screen (the prototype's) ===== */
#screen-table.active { display: flex; flex-direction: column; }
#screen-table { overflow: hidden; container: tablescreen / size; }
.room { position: relative; flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; }
.table { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; max-width: 760px; display: flex; flex-direction: column; }
/* Above the controls: the seats, the felt, the chips and the log. When they need more height than there is, they
   give way in order (Fit, in the script: #table[data-fit] "1" the seats' extras, "2" the bid log, "3" the felt's
   padding and big word, "4" your dice a size down); only then does this area scroll, the controls staying put. */
.upper { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.upper::-webkit-scrollbar { display: none; }
.seats { flex: none; display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 4px; padding: 6px 8px 2px; }
.seat { position: relative; container-type: inline-size; display: grid; justify-items: center; align-content: start; gap: 3px; min-width: 0; padding: 6px 2px 4px; border: 1px solid transparent; border-radius: 14px; background: transparent; cursor: pointer; text-align: center; transition: background-color .25s, border-color .25s, opacity .4s, transform .25s; }
.seat[data-turn] { background: var(--surface); border-color: var(--border); transform: translateY(-1px); }
.seat-face { position: relative; width: var(--seat-face); height: var(--seat-face); border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--border); background: var(--surface-2); transition: box-shadow .25s; }
.seat[data-turn] .seat-face { box-shadow: 0 0 0 3px var(--accent), 0 0 16px color-mix(in srgb, var(--accent) 45%, transparent); }
.seat-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 15px/1.15 var(--read-font); }
.seat[data-turn] .seat-name { color: var(--accent); }
.seat-tag { position: absolute; top: 4px; right: 6px; font: 700 9px/1 var(--ui-font); letter-spacing: .08em; color: var(--muted); }
.seat-ledger { max-width: 100%; font: 600 10px/1.15 var(--ui-font); color: var(--accent); letter-spacing: .01em; }
.seat[data-out] { opacity: .38; }
.seat[data-out] .seat-face { filter: grayscale(.8); }
.seat[data-out] .tray { visibility: hidden; }
/* --k: the most dice the cup holds tonight; the dice shrink to fit a narrow seat (three faces on a 320 px phone). */
.tray { --s: min(var(--tray), calc((100cqw - 10px - (var(--k, 5) - 1) * 2px) / var(--k, 5))); display: flex; gap: 2px; align-items: center; justify-content: center; max-width: 100%; min-height: calc(var(--tray) + 6px); padding: 3px 5px; border-radius: 8px; background: var(--felt); box-shadow: inset 0 1px 3px var(--shadow); }
.tray[data-six] { --s: min(calc(var(--tray) * .86), calc((100cqw - 6px - (var(--k, 6) - 1) * 1px) / var(--k, 6))); gap: 1px; padding: 3px 3px; }
.bubble { position: relative; display: inline-flex; align-items: center; gap: 5px; min-height: 30px; max-width: 100%; margin-top: 4px; padding: 3px 9px; border-radius: 10px; background: var(--surface-2); font: 600 15px/1 var(--read-font); white-space: nowrap; --s: 18px; }
.bubble::before { content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; background: inherit; transform: rotate(45deg); border-radius: 2px; }
.bubble[data-empty] { visibility: hidden; }
.bubble[data-kind="liar"] { background: var(--danger); color: var(--accent-ink); font-weight: 700; }
.bubble[data-kind="spot"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.bubble[data-kind="say"] { display: block; padding: 5px 8px; font: italic 400 13px/1.25 var(--read-font); white-space: normal; overflow-wrap: anywhere; text-align: center; border: 1px solid var(--border); }
.bubble[data-kind="say"][data-by="claude"] { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.dots { display: inline-flex; gap: 4px; padding: 0 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
.habit { min-height: 2.4em; max-width: 100%; padding: 0 2px; font: italic 13px/1.2 var(--read-font); color: var(--muted); text-align: center; overflow-wrap: anywhere; }
.habit[data-under] { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; color: var(--text); }

.felt { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; justify-content: space-evenly; gap: 4px; margin: 4px 8px 6px; padding: 8px 12px 8px; border: 3px solid var(--felt-edge); border-radius: 22px; background: radial-gradient(ellipse at 50% 35%, var(--felt-hi), var(--felt) 70%); box-shadow: inset 0 2px 14px var(--shadow), 0 1px 0 var(--surface-2); }
.felt-tags { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 6px; min-height: 26px; margin: -2px -4px 0; }
.ruletag { position: relative; display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 0 9px; border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); border-radius: 14px; background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--accent); font: 700 11px/1 var(--ui-font); min-height: 26px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
.ruletag::before { content: ""; position: absolute; inset: -9px -4px; }
.ruletag::after { content: "?"; display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid currentColor; font-size: 9px; }
.anteTag { margin-left: auto; min-height: 26px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 14px; background: color-mix(in srgb, var(--bg) 45%, transparent); color: var(--muted); font: 600 11px/1 var(--ui-font); letter-spacing: .03em; white-space: nowrap; }
.bid { display: grid; justify-items: center; min-height: 92px; }
.bid > * { grid-area: 1 / 1; }
.bid-main, .bid-count { display: grid; justify-items: center; align-content: center; gap: 6px; transition: opacity .18s; }
.bid[data-mode="count"] .bid-main { opacity: 0; visibility: hidden; }
.bid:not([data-mode="count"]) .bid-count { opacity: 0; visibility: hidden; }
.bid-word { font: 700 44px/1.1 var(--read-font); letter-spacing: .07em; text-transform: uppercase; }
.bid-word[data-quiet] { font: italic 400 24px/1.2 var(--read-font); letter-spacing: 0; text-transform: none; color: var(--muted); text-align: center; }
.bid-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 4px; min-height: 26px; --s: 24px; }
.bid-line[data-many] { --s: 18px; }
.bid-by { margin-left: 6px; font: italic 16px/1 var(--read-font); color: var(--muted); white-space: nowrap; }
.count-num { font: 700 76px/.9 var(--read-font); font-variant-numeric: tabular-nums; color: var(--accent); transition: color .2s; }
.count-num[data-state="there"] { color: var(--good); }
.count-num[data-state="over"] { color: var(--danger); }
.count-of { display: flex; align-items: center; gap: 6px; font: 15px/1 var(--read-font); color: var(--muted); --s: 18px; }
.countbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 22px; padding: 0 4px; }
.countbar .track { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 14%, transparent); overflow: hidden; }
.countbar .fill { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--field); transition: width .45s cubic-bezier(.2, .8, .3, 1), background-color .45s; }
.countbar .lbl { font: 13px/1.2 var(--ui-font); color: var(--muted); white-space: nowrap; }
.countbar .lbl b { font-size: 15px; font-variant-numeric: tabular-nums; transition: color .45s; }
.bookline { display: flex; align-items: flex-start; justify-content: center; gap: 6px; min-height: 18px; padding: 0 4px; font: 13px/1.3 var(--ui-font); color: var(--muted); text-align: center; }
.bookline svg { flex: none; width: 15px; height: 15px; margin-top: 1px; color: var(--accent); }
.bookline em { font-family: var(--read-font); color: var(--text); }
.bookline b { color: var(--text); font-variant-numeric: tabular-nums; }
.bookline .bl-bluff { color: var(--danger); }
.bookline .bl-straight { color: var(--good); }
.bookline[data-quiet] { color: var(--faint); }
.infoline { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; min-height: 0; font: 600 12px/1.3 var(--ui-font); color: var(--accent); text-align: center; }
.infoline:empty { display: none; }
.infoline span { padding: 2px 8px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 45%, transparent); }
.mycup { display: grid; justify-items: center; gap: 4px; }
.cupdice { --s: var(--die); display: flex; justify-content: center; gap: calc(var(--die) * .17); min-height: var(--die); max-width: 100%; }
.cupdice[data-six] { --s: calc(var(--die) * .86); gap: 6px; }
.cupdice:has(.die[data-twice]) { padding-bottom: 8px; }
.cupcap { display: flex; justify-content: space-between; justify-self: stretch; gap: 8px; padding: 0 4px; font: 600 11px/1.2 var(--ui-font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cupcap .turn { color: var(--accent); }
.mycup[data-turn] .cupdice .die:not([data-empty]) { box-shadow: var(--die-shadow), 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }

/* ===== Dice ===== */
.die {
  --die-shadow: inset 0 -2px 0 rgba(90, 60, 20, .16), inset 0 1px 0 rgba(255, 255, 255, .8), 0 1px 1px rgba(0, 0, 0, .25), 0 3px 8px rgba(0, 0, 0, .28);
  position: relative; flex: none; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  width: var(--s, 52px); height: var(--s, 52px); padding: calc(var(--s, 52px) * .13);
  border-radius: calc(var(--s, 52px) * .22);
  background: linear-gradient(150deg, var(--ivory-1) 0%, var(--ivory-2) 55%, var(--ivory-3) 100%);
  box-shadow: var(--die-shadow);
  transition: opacity .25s, filter .25s, box-shadow .25s;
}
.pip { align-self: center; justify-self: center; width: calc(var(--s, 52px) * .17); height: calc(var(--s, 52px) * .17); border-radius: 50%; background: radial-gradient(circle at 38% 35%, #5a4634, var(--pip) 70%); }
.pip.c1 { grid-area: 1 / 1; } .pip.c2 { grid-area: 1 / 2; } .pip.c3 { grid-area: 1 / 3; }
.pip.c4 { grid-area: 2 / 1; } .pip.c5 { grid-area: 2 / 2; } .pip.c6 { grid-area: 2 / 3; }
.pip.c7 { grid-area: 3 / 1; } .pip.c8 { grid-area: 3 / 2; } .pip.c9 { grid-area: 3 / 3; }
.die[data-wild] { box-shadow: var(--die-shadow), 0 0 0 2px var(--accent); }
.die[data-wild] .pip { width: calc(var(--s, 52px) * .3); height: calc(var(--s, 52px) * .3); background: radial-gradient(circle at 38% 35%, #e0644a, var(--wild-pip) 70%); }
.die[data-ace] .pip { width: calc(var(--s, 52px) * .3); height: calc(var(--s, 52px) * .3); }
.die[data-down] { background: linear-gradient(150deg, var(--down-1), var(--down-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(0, 0, 0, .3), 0 1px 2px rgba(0, 0, 0, .4); }
.die[data-empty] { background: transparent; box-shadow: none; border: 1.5px dashed color-mix(in srgb, var(--text) 22%, transparent); }
.tray .die[data-empty] { border-width: 1px; opacity: .6; }
.die[data-dim] { opacity: .32; filter: saturate(.3); }
.die[data-hit] { box-shadow: var(--die-shadow), 0 0 0 2px var(--accent), 0 0 14px 2px color-mix(in srgb, var(--accent) 70%, transparent); }
.die[data-peek] { box-shadow: var(--die-shadow), 0 0 0 1.5px var(--accent); }
.die .mark { position: absolute; top: 0; right: 0; width: 34%; height: 34%; border-top-right-radius: inherit; background: var(--accent); clip-path: polygon(30% 0, 100% 0, 100% 70%); opacity: .9; }
.die .fixmark { position: absolute; left: 50%; bottom: -15px; transform: translateX(-50%); font: 700 9px/1 var(--ui-font); letter-spacing: .06em; color: var(--accent); white-space: nowrap; text-transform: uppercase; }
.die .crack { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* Loaded Six: the die that counts as two 6s */
.die[data-twice]::after { content: '\00D7 2'; position: absolute; right: -7px; bottom: -7px; padding: 2px 4px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); font: 700 10px/1 var(--ui-font); letter-spacing: .02em; box-shadow: 0 1px 3px var(--shadow); white-space: nowrap; }
.die[data-twice][data-hit]::after { font-size: 12px; padding: 3px 5px; }
.die[data-pick] { cursor: pointer; }
.die[data-sel] { box-shadow: var(--die-shadow), 0 0 0 3px var(--accent); transform: translateY(-3px); }

/* ===== Tricks, log ===== */
.tricks { flex: none; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 0 8px; min-height: 0; }
.tricks:empty { display: none; }
.tricks::-webkit-scrollbar { display: none; }
.trick { position: relative; isolation: isolate; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 12px; border: 0; border-radius: 19px; background: none; font: 600 13px/1 var(--ui-font); color: var(--muted); cursor: pointer; white-space: nowrap; }
/* The pill (36 px) inside the 44 px tap target. */
.trick::before { content: ""; position: absolute; inset: 4px 0; z-index: -1; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); }
.trick i { width: 7px; height: 7px; border-radius: 50%; background: var(--field); }
.trick[data-usable] { color: var(--text); }
.trick[data-usable]::before { border-color: var(--accent); box-shadow: 0 0 4px 1px color-mix(in srgb, var(--accent) 40%, transparent); animation: glow 2.2s ease-in-out infinite; }
.trick[data-usable] i { background: var(--accent); }
.trick[data-asleep] { opacity: .5; text-decoration: line-through; text-decoration-thickness: 1px; }
.trick[data-spent] { opacity: .6; }
.trick small { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); text-decoration: none; }
@keyframes glow { 50% { box-shadow: 0 0 2px color-mix(in srgb, var(--accent) 15%, transparent); } }
.log { flex: none; min-height: 20px; padding: 3px 12px 2px; font: 13px/1.3 var(--ui-font); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.log b { color: var(--muted); font-weight: 600; }

/* ===== Action area ===== */
.actions { flex: none; display: grid; gap: 7px; padding: 8px calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal)); border-top: 1px solid var(--border); background: var(--bg); transition: opacity .25s; }
.picker { display: grid; gap: 7px; }
.picker[data-calm] { opacity: .45; }
.calls { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.calls[data-three] { grid-template-columns: 1.25fr .9fr 1fr; }
.call { display: grid; place-items: center; align-content: center; gap: 2px; min-height: 50px; padding: 2px 6px; border-radius: 12px; font: 700 21px/1 var(--read-font); letter-spacing: .02em; cursor: pointer; }
.call small { font: 600 11px/1 var(--ui-font); letter-spacing: .02em; opacity: .85; }
.call.liar { border: 1px solid var(--danger); background: var(--danger); color: var(--accent-ink); }
.call.liar2 { border: 1.5px solid var(--danger); background: transparent; color: var(--danger); font-size: 17px; }
.call.spot { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); }
.call:disabled { opacity: .4; cursor: default; }
.picker[data-calm] .call:disabled, .picker[data-calm] button:disabled { opacity: 1; }
.faces { display: grid; grid-template-columns: repeat(var(--nf, 5), minmax(0, 1fr)); gap: 6px; }
.facebtn { --s: 30px; display: grid; place-items: center; min-height: 50px; padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; }
.facebtn[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent); }
.facebtn[data-illegal] .die { opacity: .4; }
.facebtn:disabled { opacity: .3; cursor: not-allowed; }
.bidrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--field); border-radius: 12px; overflow: hidden; background: var(--surface); }
.stepper button { width: 46px; min-height: 48px; border: 0; background: transparent; font: 500 26px/1 var(--ui-font); cursor: pointer; user-select: none; -webkit-user-select: none; }
.stepper button:active:not(:disabled) { background: var(--surface-2); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper .qty { display: grid; place-items: center; min-width: 38px; font: 700 26px/1 var(--read-font); font-variant-numeric: tabular-nums; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.live { display: grid; justify-items: center; gap: 1px; min-width: 0; text-align: center; }
.live .what { font: 600 16px/1.1 var(--read-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.live .pct { font: 700 13px/1.1 var(--ui-font); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 380px) { .live .pct .long { display: none; } }
.bidbtn { min-width: 92px; min-height: 48px; border-radius: 12px; font: 700 19px/1 var(--read-font); }
.bar { display: grid; gap: 7px; }
.bar p { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
.bar .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.bar .btns[data-one] { grid-template-columns: 1fr; }
.bar .btn { min-height: 52px; border-radius: 12px; font: 700 18px/1 var(--read-font); }
.bar .btns[data-three] { grid-template-columns: 1.3fr 1fr 1fr; }
.bar .btn { flex-direction: column; gap: 3px; padding: 0 8px; }
.bar .btn small { display: block; font: 600 11px/1.1 var(--ui-font); opacity: .85; white-space: nowrap; }
.bar .btns[data-side] { grid-template-columns: 1fr 1fr minmax(64px, .55fr); }
.bar .btns[data-side] .pass { font-size: 15px; color: var(--muted); }
/* Side Bet: who is right, before the cups lift */
.sidebet { display: grid; gap: 5px; }
.sidebet .sb-q { margin: 0; text-align: center; font: 600 15px/1.25 var(--read-font); color: var(--text); }
.sidebet .sb-facts { display: flex; justify-content: center; gap: 10px; margin: 0; font: 13px/1.3 var(--ui-font); color: var(--muted); white-space: nowrap; overflow: hidden; }
.sidebet .sb-facts > span:last-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sidebet .sb-facts b { font-variant-numeric: tabular-nums; }
.sidebet .sb-facts em { color: var(--text); }

/* ===== Stamps, floats, sheets, coach ===== */
.stamp-layer { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; }
.stamp { display: grid; justify-items: center; gap: 4px; max-width: calc(100% - 16px); padding: 6px 18px 9px; border: 4px double currentColor; border-radius: 12px; background: color-mix(in srgb, var(--bg) 90%, transparent); color: var(--danger); box-shadow: 0 10px 34px var(--shadow); }
.stamp b { font: 700 52px/1 var(--read-font); letter-spacing: .04em; white-space: nowrap; }
.stamp small { font: 600 14px/1.2 var(--ui-font); color: var(--text); letter-spacing: .01em; text-align: center; }
.stamp[data-kind="good"] { color: var(--good); }
.stamp[data-kind="accent"] { color: var(--accent); }
.stamp[data-kind="big"] { color: var(--accent); border-width: 6px; }
.toast { position: absolute; left: 50%; top: 40px; z-index: 7; max-width: calc(100% - 20px); transform: translateX(-50%); padding: 7px 14px; border: 1px solid var(--accent); border-radius: 18px; background: var(--surface); font: italic 15px/1.25 var(--read-font); text-align: center; box-shadow: 0 6px 18px var(--shadow); pointer-events: none; }
.fx { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
.float { position: absolute; left: 0; top: 0; font: 700 22px/1 var(--read-font); color: var(--good); text-shadow: 0 2px 6px var(--shadow); white-space: nowrap; }
.float[data-kind="danger"] { color: var(--danger); }
.speck { position: absolute; left: 0; top: 0; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.speck:nth-child(3n) { border-radius: 50%; width: 5px; height: 5px; background: var(--focus); }
.sheet { position: absolute; left: 6px; right: 6px; bottom: 0; z-index: 8; max-height: 78%; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px calc(12px + var(--sab)); border: 1px solid var(--border); border-bottom: 0; border-radius: 18px 18px 0 0; background: var(--surface); box-shadow: 0 -14px 34px var(--shadow); }
.sheet h2 { margin: 0 0 2px; font: 600 22px/1.2 var(--read-font); }
.sheet .sub { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.35; }
.sheet .go { position: sticky; bottom: 0; width: 100%; min-height: 52px; margin-top: 10px; font: 700 18px/1 var(--read-font); border-radius: 12px; box-shadow: 0 -8px 14px var(--surface); }
.had { display: grid; gap: 0; }
.had-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 7px 0; border-top: 1px solid var(--border); }
.had-row .mini { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
.mini.you { display: grid; place-items: center; background: var(--surface-2); font: 700 10px/1 var(--ui-font); letter-spacing: .04em; color: var(--muted); }
.had-main { min-width: 0; }
.had-bid { display: flex; align-items: center; gap: 6px; font: 600 15px/1.2 var(--read-font); --s: 16px; flex-wrap: wrap; }
.had-bid .held { font: 13px/1.2 var(--ui-font); color: var(--muted); }
.had-habit { font: italic 13px/1.3 var(--read-font); color: var(--muted); }
.had-habit .tally { font: normal 12px/1.3 var(--ui-font); color: var(--faint); }
.had-habit .tally b { color: var(--text); font-weight: 600; }
.tag { padding: 3px 7px; border: 1px solid currentColor; border-radius: 6px; font: 700 11px/1 var(--ui-font); letter-spacing: .08em; white-space: nowrap; }
.tag.bluff { color: var(--danger); }
.tag.straight { color: var(--good); }
.end-big { margin: 2px 0 6px; font: 700 40px/1 var(--read-font); color: var(--accent); font-variant-numeric: tabular-nums; }
.end-big[data-sign="up"] { color: var(--good); }
.goal { margin: 2px 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.goal[data-ok] { color: var(--good); }
.end-big[data-sign="down"] { color: var(--danger); }
.end-big small { margin-left: 8px; font: 500 14px/1 var(--ui-font); color: var(--muted); }
.had-more { justify-self: start; min-height: var(--tap); padding: 0 2px; border: 0; background: none; color: var(--muted); font: 600 13px/1 var(--ui-font); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.coach { position: absolute; left: 10px; right: 10px; top: 6px; z-index: 9; display: grid; gap: 4px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 14px; background: var(--surface); box-shadow: 0 10px 26px var(--shadow); font: 14px/1.35 var(--ui-font); }
.coach p { margin: 0; }
.coach .row { justify-content: space-between; gap: 6px; }
.coach .btn { min-height: 44px; padding: 0 14px; font-size: 14px; }
.coach .linkbtn { min-height: 44px; color: var(--muted); }
/* A tip about the people at the top sits at the foot of the table, over the bid controls (or an open sheet's button). */
.coach[data-at="bottom"] { top: auto; bottom: calc(8px + var(--sab)); left: calc(10px + var(--sal)); right: calc(10px + var(--sar)); box-shadow: 0 -10px 26px var(--shadow); }

/* ===== The practice hand: the real table, a short line of teaching above the controls ===== */
#screen-table[data-lesson] #cash, #screen-table[data-lesson] #streak, #screen-table[data-lesson] #btn-bookside, #screen-table[data-lesson] #btn-sound { display: none; }
/* Round one plays with the cups open: the Count waits for round two, when it means something. */
#screen-table[data-lesson="open"] #countbar, #screen-table[data-lesson="open"] #bookline, #screen-table[data-lesson="open"] .live .pct, #screen-table[data-lesson="open"] .call small { visibility: hidden; }
.lesson { padding: 0 2px; }
.lesson p { margin: 0; min-height: calc(3 * 1.36em); font: 15px/1.36 var(--ui-font); }
.lesson p b { color: var(--accent); }
.lesson[data-wait] { opacity: .4; transition: opacity .2s; }
.lesson-go { display: grid; }
.lesson-go .btn { min-height: 50px; border-radius: 12px; font: 700 20px/1 var(--read-font); }
#btn-lesson-skip { display: none; font-size: 14px; color: var(--muted); white-space: nowrap; }
#screen-table[data-lesson] #btn-lesson-skip { display: inline-flex; }
#screen-table[data-lesson] .felt-tags { display: none; }
/* A short phone: the lesson never asks for a face, so the face row makes room for its line of teaching. */
@container tablescreen (max-height: 680px) { #screen-table[data-lesson] .faces { display: none; } }
.tray[data-open] { background: var(--felt-hi); box-shadow: inset 0 1px 3px var(--shadow), 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
[data-point] { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; animation: point 1.3s ease-in-out infinite; }
@keyframes point { 50% { outline-color: color-mix(in srgb, var(--accent) 25%, transparent); } }
.sheet .lesson-back { width: 100%; margin-top: 8px; }
.lesson-end p { margin: 0 0 8px; font-size: 15px; line-height: 1.45; }
@media (prefers-reduced-motion: reduce) { [data-point] { animation: none; } }

/* ===== The Book (beside the table on wide screens, its own panel on a phone; and the collection) ===== */
.bookside { flex: 0 0 340px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px calc(16px + var(--sab)); border-left: 1px solid var(--border); }
.bookside h2 { margin: 0 0 2px; font: 600 22px/1.2 var(--read-font); }
.bookside .sub { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.bpage { margin: 0 0 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.bpage-head { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 6px; }
.bpage-head .mini { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
.bpage-name { font: 600 17px/1.2 var(--read-font); }
.bpage-stat { font-size: 13px; color: var(--muted); }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; align-items: center; }
.hrow em { font: italic 14px/1.25 var(--read-font); }
.hrow em[data-under] { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.hrow .n { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hrow .n b { color: var(--text); }
.hrow .meter { grid-column: 1 / -1; display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--text) 10%, transparent); }
.hrow .meter i { display: block; height: 100%; }
.hrow .meter .mb { background: var(--danger); }
.hrow .meter .ms { background: var(--good); }
.hrow[data-bump] em { color: var(--accent); }
.hrow[data-quiet] em { font-style: normal; color: var(--faint); font-size: 13px; }
.truth { margin: 6px 0 0; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); font-size: 13px; color: var(--accent); }
@media (min-width: 980px) { #btn-bookside { display: none; } }
@media (max-width: 979px) {
  .bookside { display: none; flex: 1 1 auto; max-width: 760px; border-left: 0; }
  #screen-table[data-book] .bookside { display: block; }
  #screen-table[data-book] .table { display: none; }
}
.grid50 { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.gface { display: grid; justify-items: center; gap: 4px; min-height: 96px; padding: 8px 2px 6px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: center; }
.gface .mini { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
.gface .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 13px/1.15 var(--read-font); }
.gface .n { font-size: 11px; color: var(--muted); }
.gface[data-unmet] { cursor: default; background: transparent; border-style: dashed; }
.gface[data-unmet] .mini { filter: grayscale(1) brightness(.55) contrast(.8); opacity: .55; }
.gface[data-unmet] .nm { color: var(--faint); }
.pp-head { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; margin-bottom: 8px; }
.pp-head .mini { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--border); }
.pp-head h2 { margin: 0; }
.pp-look { margin: 2px 0 0; color: var(--muted); font: italic 14px/1.35 var(--read-font); }
.pp-stat { margin: 10px 0 4px; font: 600 17px/1.3 var(--read-font); }
.pp-rec { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

/* ===== The back room ===== */
.curtis { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; margin: 8px 0 12px; }
.curtis .mini { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--border); }
.curtis p { margin: 0; font: italic 18px/1.35 var(--read-font); }

/* Fit: what gives way when the table's content needs more height than it has (set by the script, in this order). */
/* 1. The seats' extras: a habit line under a face keeps to one line (the bidder's is in the felt too), tighter gaps, smaller faces. */
#table[data-fit~="1"] .seats { gap: 2px; padding-top: 2px; padding-bottom: 0; }
#table[data-fit~="1"] .seat { gap: 1px; padding-top: 2px; padding-bottom: 2px; }
#table[data-fit~="1"] .seat-face { width: min(var(--seat-face), 30px); height: min(var(--seat-face), 30px); }
#table[data-fit~="1"] .seat .habit { min-height: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#table[data-fit~="1"] .bubble { min-height: 26px; margin-top: 2px; }
/* 2. The bid log above the controls. */
#table[data-fit~="2"] .log { display: none; }
/* 3. The felt: tighter padding, a smaller big word. */
#table[data-fit~="3"] .felt { margin: 2px 8px 4px; padding: 4px 10px; gap: 2px; }
#table[data-fit~="3"] .felt-tags { min-height: 24px; margin-top: 0; }
#table[data-fit~="3"] .bid { min-height: 0; }
#table[data-fit~="3"] .bid-main { gap: 3px; }
#table[data-fit~="3"] .bid-word { font-size: 28px; }
#table[data-fit~="3"] .bid-word[data-quiet] { font-size: 20px; }
#table[data-fit~="3"] .bid-line { --s: 18px; min-height: 20px; }
#table[data-fit~="3"] .count-num { font-size: 46px; }
#table[data-fit~="3"] .countbar { min-height: 18px; }
/* 4. Your dice a size down (still easy to read). After this the area above the controls scrolls. */
#table[data-fit~="4"] .cupdice { --s: min(var(--die), 38px); gap: 6px; min-height: min(var(--die), 38px); }
#table[data-fit~="4"] .cupdice[data-six] { --s: min(calc(var(--die) * .86), 34px); gap: 4px; }
#table[data-fit~="4"] .mycup { gap: 2px; }
@media (prefers-reduced-motion: reduce) {
  .dots i, .trick[data-usable]::before { animation: none; }
  .countbar .fill { transition: none; }
}

<script>
'use strict';
// The theme before the first paint: Bones' own choice, else the town's (as lockin.html), else dark.
(function () {
  try {
    var own = JSON.parse(window.localStorage.getItem('novatria.bones.settings') || 'null');
    var t = own && (own.theme === 'dark' || own.theme === 'parchment') ? own.theme : null;
    if (!t) { var saved = JSON.parse(window.localStorage.getItem('novatria.settings') || 'null'); if (saved && (saved.theme === 'dark' || saved.theme === 'parchment')) t = saved.theme; }
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* storage off: the default theme */ }
})();
/* ==BONES:ENGINE:BEGIN== */
/* ===========================================================================
   BONES ENGINE: the rules, the people, the bots, the back room, the Book.
   Pure calculation: no DOM, no clock, no unseeded randomness. Runs unchanged in
   Node's vm. Attaches itself as Game.Engine and nothing else.

   ---------------------------------------------------------------------------
   THE CONTRACT (for the UI)
   ---------------------------------------------------------------------------
   The night state S is plain JSON: save it with JSON.stringify, resume with
   JSON.parse; the copy plays on exactly as the original would. All dice come
   from a seeded generator kept in S.rng: same seed + same actions = same
   night, byte for byte. Never edit S yourself; only call the functions.

   Seats: the human is always seat 0; the people sit at 1..n, clockwise in
   turn order (seat 1 is "on your left"). Faces are 1..6. Ones are wild (they
   count as any face bid) unless the table's house rule is Straight; then 1 is
   an ordinary face and may be bid. Bid order: (q,f) beats (q0,f0) when
   q > q0, or q == q0 and f > f0.

   ENTRY POINTS
     Engine.newNight({ seed, daily, book, tricks }) -> S
         seed: any string/number (default 'bones'); daily: 'YYYY-MM-DD' (the
         seed becomes Engine.dailySeed(daily)); book: the persisted Book (so
         bots remember how you bluff, and Reading Glasses can count habits
         already seen); tricks: ids held from the start (tests / sims only).
     Engine.act(S, action) -> events        the one way to change S.
         Legal actions by phase (S.phase / view.phase):
           'choose': {t:'sit', i}            sit at card i of Engine.options(S)
                     {t:'walk'}              Last Call only: go home with your cash
           'table' wait 'turn':  {t:'bid', q, f} | {t:'liar'} | {t:'spot'}
                                 {t:'liar', double:true}  (Double or Nothing, while
                                       view.table.double.left > 0)
                                 {t:'use', id:'nod'}
                                 {t:'use', id:'slowroll', dice?:[indices]} (all if omitted)
                                 {t:'use', id:'slowroll', keep:'best'}  (keep your best
                                       face, re-roll the rest: the one-tap choice)
                                 {t:'use', id:'palm', die, face}  (face 2..6)
           'table' wait 'ready': {t:'go'} (also the two uses: slowroll, palm)
                      ('ready' only happens when you hold Slow Roll: your
                       chance to re-roll before bid 1, opener or not, unless
                       you open blind)
           'table' wait 'side':  {t:'side', pick:'bidder'|'caller'} | {t:'side'} (pass)
                      ('side' only happens when you hold Side Bet and two others
                       go to a challenge: say who is right before the cups lift)
           'table' wait 'next':  {t:'next'}  start the next round (after a reveal)
           'shop':   {t:'buy', i} | {t:'sell', id} | {t:'reroll'} | {t:'leave'}
           'over':   nothing.
         An illegal action changes nothing and returns
         [{t:'error', msg}]. Every other batch ends with {t:'wait', need},
         need = 'turn'|'ready'|'side'|'next'|'choose'|'shop'|'over': what the
         human must do now. There is never anything left to "run".
     Engine.sit(S, i) = act(S, {t:'sit', i}).
     Engine.advance(S) -> events   runs bots if anything is pending (after a
         resume it is always a no-op that returns [{t:'wait', need}]).
     Engine.playNight(seed, policy, opts) -> { S, events }   drives a whole
         night: policy(S, view, legal, Engine) returns the next action.
         opts: { daily, book, tricks, keepEvents }.
     Engine.basicPolicy   a plain by-the-Count player (a usable policy): Liar
         under 38%, Spot on over 50% exact, else opens or jumps to
         Engine.suggest, else the smallest raise it puts at 50%; a side bet
         on whichever side the Count favours.

   READING (never mutate S)
     Engine.view(S) -> {
       v, phase, hour (0..4), hourName, cash, streak, seed, daily, ending,
       tricks: [{ id, name, text, rarity, kind, usable, asleep, goesWith }],
               usable = can be used right now; asleep = a dice trick at Last
               Call (Loretta counts the bones: dice tricks do not work there)
       options: (phase 'choose') same as Engine.options(S),
       shop:    (phase 'shop') same as Engine.shopView(S),
       table: null | {
         hour, kind:'easy'|'rich'|'last', rule:{id,name,text}|null, buyIn,
         ante, pot, onTab, round (1..), wait, turn (seat), opener (seat),
         wild (bool), faces:[...biddable], total (dice on the table),
         seats: [{ seat, id ('me' or person id), name, isMe, dice (count),
                   start (starting count), out, lastBid:{q,f}|null,
                   shown:[{i, face, why:'open'|'mirror'|'cornered'}],
                   ledger: 'bluffs about 1 bid in 3' | null }],
         myDice: [faces] | null (null while you bid blind),
         myFixed: [die indices]: your fixed 1s (Shaved Die / Hot Hand), wild
                  only for your own bids,
         myLoaded: [die index] | []: your loaded six while it counts as two 6s,
         slow: null | { f, reroll:[indices], left }  (Slow Roll ready: your best
               face, the dice keep:'best' would re-roll, re-rolls left)
         palm: null | { left, loaded }  (Palm held: uses left at this table,
               the loaded six it cannot turn)
         double: null | { left, uses }  (Double or Nothing held: calls for 2
               left at this table, of `uses` a table)
         side: null | { kind, caller, callerId, bidder, bidderId, q, f, count,
                 exact, habit, stake, pays }  (wait 'side': the challenge between
                 two others, the Count of its bid and the habit that came with it)
         blind (bool), bid: {who, id, q, f} | null,
         history: [{ who, id, q, f, habit:{i, text, line, underline}|null }],
         ones: number|null (Bar Mirror), nod: {q, f, truth}|null,
         count: Count of the bid in front of you (0..1) | null,
         cups: [[faces] per seat] | null (only in the practice hand's open round),
         last: null | { reveal, readout, lines } (the previous round's
               reveal and readout events, until the next round starts)
       }
     }
       The view never holds another player's hidden dice, any person's
       hidden parameters or which habit is a tell (Reading Glasses' underline
       and Lyman's Ledger's phrase are the only exceptions, granted by tricks).
     Engine.options(S) -> [{ i, kind, hour, hourName, seats, dice, buyIn, pot,
         ante, rule:{id,name,text}|null, people:[public person], affordable,
         viaTab }]   (one card at Last Call; [] outside phase 'choose')
     Engine.legal(S) -> { need, mustBid, canBid, canLiar, canSpot, canDouble,
         minBid:{q,f}|null, maxQ, maxFor:{face: largest legal q}, faces,
         uses:[ids], canGo, canNext, canSide,
         sit:[i...], canWalk, buy:[i...], sell:[ids], canReroll,
         rerollPrice, canLeave }
     Engine.isLegalBid(S, q, f) -> bool
     Engine.count(S, q, f) -> P(at least q f's on the table) from your cup and
         what tricks showed you, other dice fair. Exact. null off-table.
         (q,f) equal to the bid in front of you is judged as its bidder's bid
         (your fixed 1s are plain for it); any other (q,f) as your own raise.
     Engine.countExact(S, q, f) -> P(exactly q), same footing (for Spot On).
     Engine.suggest(S, at = 0.6) -> {q, f} | null   a sensible raise by the Count:
         on your best face, the most dice the Count puts at `at` or better, if
         that is a legal bid now (the picker's default; basicPolicy opens and
         jumps to it).
     Engine.shopView(S) -> { hour, offers:[{ i, id, name, text, rarity, kind,
         price, affordable, goesWith:[held ids] }|null] (3; 4 with Friends
         Rates), held:[{ id, name, text, sell, goesWith }], slots: 5,
         rerollPrice, cash }
     Engine.BUILDS -> [{ id, name, tricks:[ids] }]   tricks that work together;
     Engine.partners(id) -> [ids] sharing a build with id. goesWith = the
         partners you hold.
     Engine.summary(S) -> facts for the ledger and the end screen (see fn).
     Engine.shareLine(S) -> 'Bones · 2026-11-21 · beat the house · $2,340 · 🎲🎲⬛🎲👑'
     Engine.column(S) -> { headline, body, byline }  Pearl's column, templated.
     Engine.columnFacts(S) -> plain text account of the night (for a prompt).
     Engine.talkFacts(S, events) -> plain text account of one reveal.
     Engine.dailySeed('2026-11-21') -> 'daily:2026-11-21'

   THE PRACTICE HAND ("Learn it in a minute")
     Engine.lesson() -> { S, events }   a fixed little table for the lesson:
         you, Glenda (seat 1) and Gerald (seat 2), three dice each, no ante,
         no buy-in, no pot. Its two rounds have set cups and set moves for
         the people (Engine.LESSON); the first is played with every cup open
         (view.table.cups and the roll event's cups hold all the dice, the
         only time the view shows another cup outside a reveal). events is
         the sit, the first roll and the people's moves up to your turn.
         Play it on with Engine.act as any table. S.lesson marks it; nothing
         about it belongs in the Book, the ledger or a saved night (that is
         the UI's to keep apart). In a lesson round a person's move comes
         from the script while it lasts, then from the bots as usual.

   THE BOOK (persisted by the UI across nights)
     Engine.bookApply(book|null, events) -> new book (pure; feed it every
         batch of events). Engine.bookPage(book, personId, S?) -> {
         id, name, met, nights, bids, bluffs, won, lost, head,
         rows:[{ i, habit, n, bluff, straight, text, underline }],
         quiet:{ n, bluff, straight }  (bids with no habit shown),
         truth: phrase|null }   (underline / truth only via S's tricks)

   DATA: Engine.PEOPLE (public: id, name, first, age, pronouns, look, voice,
   habits), Engine.TRICKS, Engine.HOUSE_RULES, Engine.HOURS, Engine.VERSION.

   EVENTS (in order; each carries what it needs to be drawn)
     {t:'hour', hour, hourName, options}              a new hour; cards to pick
     {t:'sit', hour, kind, night, rule, buyIn, ante, pot, onTab,
               seats:[{seat, id, name, dice}]}
     {t:'pay', amount (signed), why, cash}            every change of cash; why =
         'buyin'|'won'|'lost'|'streak'|'spot'|'sticky'|'snake'|'pot'|'refund'|
         'buy'|'sell'|'reroll'|'side'
     {t:'roll', round, opener, openerId, mine:[faces]|null, counts:[per seat],
               open:[{seat, face}], blind, cups?}     a round starts (cups: every
               seat's dice, only in the practice hand's open round)
     {t:'look', mine}                                 a blind opener sees the cup
     {t:'trick', id, ...}                             a trick did something:
         shaved/loaded/hothand {die} · extrabone {dice} · rabbit {saved}
         slowroll {dice, mine, left, kept?} · palm {die, face, mine, left}
         mirror {seat, who, die, face}
         barmirror {ones} · nod {q, f, truth} · cornered {shown:[{seat,die,face}]}
         sticky {amount} · sidebet {pick, right, amount} · housemoney {extra}
         snake {ones, amount}
         tab {buyIn} · honest {who, n} · double {who, n, left} · close {} · lastword {}
     {t:'bid', who, id, name, q, f, habit:{i, text, line, underline}|null}
     {t:'call', who, id, name, kind:'liar'|'spot', on:{who, id, q, f}}
     {t:'reveal', kind, caller, bidder, q, f, wild, count, good, exact,
               cups:[{who, id, dice}], loaded?}   loaded: the index of your
               loaded six in your cup when it counted as two (a bid of 6s)
     {t:'lose', who, id, n, left} · {t:'gain', who, id, left}
     {t:'out', who, id, name, place}
     {t:'readout', bids:[{who, id, name, q, f, held, p, bluff,
               habit:i|null, text|null}]}    "what they had": held = matching
               dice in the bidder's cup; p = P(true) from the bidder's own cup
     {t:'bark', who, id, name, text}                  a scripted one-liner
     {t:'tableEnd', hour, kind, place, won, payout, refund, net, rounds,
               people, cash}   net = everything this table did to your cash
               (buy-in, antes won and lost, bonuses, pot, refund), signed

    ev.push(...trickEv);
    // Information tricks.
    const shown = (seat, used) => { const s = T.seats[seat]; const free = s.dice.map((d, i) => i).filter(i => !used.includes(i) && !(T.rule === 'open' && i === 0)); return free.length ? free[ri(S, free.length)] : -1; };
    if (has(S, 'mirror')) {
      const left = nextAlive(T, 0);
      if (left !== 0 && T.seats[left].n >= MIRROR_MIN) { const i = shown(left, []); if (i >= 0) { R.peek.push({ seat: left, i, why: 'mirror' }); ev.push({ t: 'trick', id: 'mirror', seat: left, who: T.seats[left].id, die: i, face: T.seats[left].dice[i] }); } }
    }
    if (has(S, 'cornered') && T.seats[0].n === 1) {
      const out = [];
      alive(T).filter(k => k !== 0).forEach(k => { const i = shown(k, R.peek.filter(p => p.seat === k).map(p => p.i)); if (i >= 0) { R.peek.push({ seat: k, i, why: 'cornered' }); out.push({ seat: k, die: i, face: T.seats[k].dice[i] }); } });
      if (out.length) ev.push({ t: 'trick', id: 'cornered', shown: out });
    }
    if (has(S, 'barmirror')) { R.ones = countOnes(T); ev.push({ t: 'trick', id: 'barmirror', ones: R.ones }); }
    // Slow Roll: a beat before the first bid of the round, whoever opens (not while you bid blind).
    if (has(S, 'slowroll') && !blind) T.wait = 'ready';
  }
  function countOnes(T) { let c = 0; T.seats.forEach(s => { if (!s.out) s.dice.forEach(d => { if (d === 1) c++; }); }); return c; }

  // Record a bid: classify it by the one bluff definition, show at most one habit line.
  // forced (the practice hand's script only): the habit to show, an index or null for none.
  function placeBid(S, T, s, q, f, ev, forced) {
    const R = T.round, seat = T.seats[s], wild = isWild(T), total = totalDice(T);
    const own = !ownBlind(T, s);
    // Your loaded six is a second 6 in your own cup.
    const twice = s === 0 && f === 6 && loadedAt(T) >= 0 ? 1 : 0;
    const p = pFrom(knownFor(T, s, own), total, q - (own ? twice : 0), f, wild);
    const held = seat.dice.filter(d => hit(d, f, wild)).length + twice;
    const bluff = p < BLUFF_P;
    let habit = null;
    if (seat.id !== 'me') {
      const per = P[seat.id], st = TELL[per.tier], applies = per.kind === 'bluff' ? bluff : !bluff;
      const cand = [];
      if (forced !== undefined) { if (forced !== null) cand.push(forced); }
      else {
        if (rnd(S) < (applies ? st[0] : st[1])) cand.push(per.tell);
        for (let k = 0; k < 3; k++) if (k !== per.tell && rnd(S) < IDLE) cand.push(k);
      }
      if (cand.length) {
        const i = cand[ri(S, cand.length)];
        const seen = S.seenH[seat.id] = S.seenH[seat.id] || [0, 0, 0];
        seen[i]++;
        const total3 = seen[i] + ((S.prior[seat.id] || [])[i] || 0);
        habit = { i, text: per.habits[i], line: per.first + ' ' + per.habits[i] + '.', underline: has(S, 'glasses') && i === per.tell && total3 >= 3 };
      }
    } else { S.stats.bids++; if (bluff) S.stats.bluffs++; }
    R.bids.push({ who: s, q, f, p, held, bluff, habit });
    ev.push({ t: 'bid', who: s, id: seat.id, name: nameOf(T, s), q, f, habit: habit ? clone(habit) : null });
    if (R.blindSeat === s && !R.looked) {
      R.looked = true;
      if (s === 0) ev.push({ t: 'look', mine: seat.dice.slice() });
    }
    R.turn = nextAlive(T, s);
  }

  // ----- the bots -----
  // How often seat j's revealed bids were bluffs, as seat s estimates it.
  function estBluff(S, T, j) {
    // Poker Face: you always look honest to them, whatever they have caught tonight or remember.
    if (j === 0 && has(S, 'pokerface')) return POKER_EST;
    let n = 4 + T.seen[j].n, b = 1 + T.seen[j].b;
    // A little memory of you from earlier nights (the Book): worth at most 10 bids seen tonight.
    if (j === 0 && S.mem.bids) { const w = 0.25 * Math.min(S.mem.bids, 40); n += w; b += w * S.mem.bluffs / S.mem.bids; }
    return b / n;
  }

  function botMove(S, T, s) {
    const seat = T.seats[s], per = P[seat.id], R = T.round, wild = isWild(T), total = totalDice(T), faces = facesOf(T);
    const cur = lastBid(T);
    const own = !ownBlind(T, s);
    const known = knownFor(T, s, own);
    const n = total - known.length, p = wild ? 1 / 3 : 1 / 6;
    const lost = seat.lost;
    const bluffy = clamp(per.bluff + per.tilt * 0.05 * lost, 0.02, 0.7);
    const nerve = clamp(per.nerve + per.tilt * 0.03 * lost, 0.1, 0.6);
    const noise = (1 - per.skill) * NOISE;
    // A poor player overreaches; a careful one less so (their mistake is calling too late).
    const over = OVER * (1 - per.skill) * (0.5 + per.bluff);
    const matches = f => known.filter(d => hit(d, f, wild)).length;
    // Faces others have bid read as evidence: a good player weighs it by how honest
    // the bidder has been; a poor one swallows it whole (and so calls too late).
    const bump = f => {
      let b = 0;
      const by = {};
      R.bids.forEach(x => { if (x.who !== s && x.f === f) by[x.who] = Math.max(by[x.who] || 0, x.q); });
      // A good reader also weighs how far over the table's expectation the bid went.
      for (const j in by) b += (per.skill * (1 - estBluff(S, T, +j)) * READ * clamp(by[j] - total * p + SIZE, 0.5, 2) + (1 - per.skill) * GULL) * Math.min(1, T.seats[+j].n / 3);
      return b;
    };
    const exactP = (q, f) => pFrom(known, total, q, f, wild);
    // What it believes without the noise: bids are sized from this, so one lucky
    // draw of noise never sizes a bid; the noise is in whether it believes the one in front.
    const clean = (q, f) => {
      if (q > total) return 0;
      const need = q - matches(f);
      return need <= 0 ? 1 : tailF(n, need - bump(f), p);
    };
    const believe = (q, f) => {
      const c = clean(q, f);
      return c === 0 || c === 1 ? c : clamp(c + (rnd(S) - 0.5) * 2 * noise, 0, 1);
    };
    // Its comfortable level: on a face it likes, the most dice it believes at its own
    // comfort (cautious honest people want ~0.8, brash ones ~0.5).
    const conf = clamp(COMFORT[0] - COMFORT[1] * (bluffy - 0.06) / 0.44, 0.45, 0.85);
    const level = (f, c) => { let q = 0; for (let k = 1; k <= total; k++) { if (clean(k, f) >= c) q = k; else break; } return q; };
    const comfort = c => {
      let best = null;
      for (const f of faces) { const q = level(f, c); if (q && (!best || q > best.q || (q === best.q && clean(q, f) >= clean(best.q, best.f)))) best = { q, f }; }
      return best;
    };
    // A poor player sometimes reaches one further than it should (never under ~35% by its own cup).
    const reach = c => { if (c.q < total && rnd(S) < over && exactP(c.q + 1, c.f) >= REACH) return { q: c.q + 1, f: c.f }; return c; };
    // How true a bid looks from outside (by its face value, no cup seen).
    const look = c => tail(total - publicDice(T, -1).length, c.q - publicDice(T, -1).filter(d => hit(d, c.f, wild)).length, p);
    if (!cur) {
      // Opening: at about its comfortable level (a little under, sometimes exactly), or a deliberate bluff.
      if (!own) { const f = faces[ri(S, faces.length)]; return { t: 'bid', q: clamp(Math.floor(total * p), 1, total), f }; }
      const order = shuffle(S, faces).sort((a, b) => matches(b) - matches(a));
      if (rnd(S) < bluffy * OPEN_BLUFF) {
        // A face it does not hold, at the first count that is a bluff by its own cup
        // (a good liar backs off to one that still looks true from outside).
        const f = order[order.length - 1];
        let q = 1; while (q < total && exactP(q, f) >= BLUFF_P) q++;
        if (exactP(q, f) < BLUFF_P && (rnd(S) >= per.skill || look({ q, f }) >= LOOK)) return { t: 'bid', q, f };
      }
      // The most it believes at its comfort on any face, that the table would also
      // believe at face value and that says something (not a sure thing); failing
      // that, the same without the last wish; failing that, its plain level.
      const want = conf + OPEN_UNDER * rnd(S);
      // (A shark cares less what the table believes: it opens nearer its full level.)
      const lookAt = OPEN_LOOK * (1 - LOOK_SHARK * clamp((per.skill - 0.6) / 0.4, 0, 1));
      const pick = test => { let best = null; for (const f of order) for (let q = 1; q <= total; q++) { const x = exactP(q, f); if (x < want) break; if (test(q, f, x) && (!best || q > best.q)) best = { q, f }; } return best; };
      const c = pick((q, f, x) => x <= TRIVIAL && look({ q, f }) >= lookAt) || pick((q, f) => look({ q, f }) >= lookAt) || comfort(want) || { q: 1, f: order[0] };
      const o = reach(c);
      return { t: 'bid', q: clamp(o.q, 1, total), f: o.f };
    }
    const bidder = cur.who, est = estBluff(S, T, bidder);
    const thr = nerve + per.skill * (est - 0.25) * 0.8;
    const pc = believe(cur.q, cur.f);
    const capped = seat.n >= T.start[s];
    const pe = clamp(pmf(n, cur.q - matches(cur.f), p) + (rnd(S) - 0.5) * noise, 0, 1);
    const spotThr = 0.62 - 0.4 * per.spot + (capped ? 0.12 : 0);
    if (cur.q <= total && pe >= spotThr) return { t: 'spot' };
    const cands = [];
    for (let q = cur.q; q <= Math.min(total, cur.q + 2); q++) for (const f of faces) if (higher(q, f, cur)) cands.push({ q, f, b: believe(q, f), x: exactP(q, f) });
    if (!cands.length) return { t: 'liar' };
    // A close call is not worth making while a raise it likes is there (most of all on
    // the round's first bid: hardly anyone calls the opener).
    const credit = CREDIT * (R.bids.length === 1 ? 1 : 0.5) * (1 - SHARP * per.skill);
    if (pc < thr && !(pc >= thr - credit && cands.some(c => c.q <= cur.q + 1 && c.b >= RAISE_OK))) return { t: 'liar' };
    // Where it would like the bid to be. When the bid in front is well below that, it
    // jumps there rather than creep up by the minimum.
    const target = comfort(conf);
    const far = !!target && higher(target.q, target.f, cur) && target.q >= cur.q + 2;
    const top = far ? target.q : cur.q + 1;
    if (rnd(S) < bluffy) {
      // A good liar only tells a lie that looks true from outside; a poor one tells the first that comes.
      const stretch = [];
      for (let q = cur.q; q <= Math.min(total, top); q++) for (const f of faces) if (higher(q, f, cur) && exactP(q, f) < BLUFF_P) stretch.push({ q, f, x: exactP(q, f) });
      if (stretch.length) {
        if (rnd(S) >= per.skill) return { t: 'bid', q: stretch[0].q, f: stretch[0].f };
        const c = stretch.filter(k => look(k) >= LOOK).sort((a, b) => look(b) - look(a))[0];
        if (c) return { t: 'bid', q: c.q, f: c.f };
      }
    }
    if (far && rnd(S) < JUMP) {
      const j = target.q - 1 > cur.q && rnd(S) < JUMP_DROP && exactP(target.q - 1, target.f) <= TRIVIAL ? { q: target.q - 1, f: target.f } : reach(target);
      return { t: 'bid', q: j.q, f: j.f };
    }
    // The smallest raise it believes, passing over sure things that say nothing when it can.
    const liked = cands.filter(c => c.b >= 0.5 - over), real = liked.filter(c => c.x <= TRIVIAL);
    // An honest player prefers a raise its own cup backs (so it does not bluff by accident).
    const backed = (real.length ? real : liked).filter(c => c.x >= BLUFF_P);
    const good = backed.length && rnd(S) >= bluffy ? backed : real.length ? real : liked;
    // With nothing its own cup backs, an honest player would sooner call than stretch.
    if (good.length && !backed.length && rnd(S) < HONEST * (1 - bluffy / 0.5)) return { t: 'liar' };
    if (good.length) {
      const minQ = good[0].q;
      let c = good[0];
      if (rnd(S) < per.skill) c = good.filter(g => g.q === minQ).sort((a, b) => b.b - a.b)[0];
      if (rnd(S) < 0.08 + 0.2 * (1 - per.skill)) { const up = cands.find(k => k.f === c.f && k.q === c.q + 1); if (up) c = up; }
      return { t: 'bid', q: c.q, f: c.f };
    }
    if (rnd(S) < bluffy * 1.5 + 0.1) { const thin = cands.filter(c => c.q <= cur.q + 1).sort((a, b) => b.b - a.b)[0]; if (thin) return { t: 'bid', q: thin.q, f: thin.f }; }
    return { t: 'liar' };
  }

  // ----- challenges -----
  function loseDice(S, T, s, n, ev) {
    const seat = T.seats[s];
    if (s === 0 && n > 0 && has(S, 'rabbit') && !T.used.rabbit) { T.used.rabbit = true; n--; ev.push({ t: 'trick', id: 'rabbit', saved: 1 }); }
    if (n <= 0) return;
    let left = seat.n - n;
    if (left <= 0 && s === 0 && has(S, 'lastword') && !T.used.lastword) { T.used.lastword = true; left = 1; ev.push({ t: 'trick', id: 'lastword' }); }
    left = Math.max(0, left);
    const lostN = seat.n - left;
    seat.n = left; seat.lost += lostN;
    ev.push({ t: 'lose', who: s, id: seat.id, n: lostN, left });
    if (left === 0) {
      seat.out = true; seat.dice = [];
      seat.place = alive(T).length + 1;
      ev.push({ t: 'out', who: s, id: seat.id, name: nameOf(T, s), place: seat.place });
    }
  }

  // The call itself (said out loud). With Side Bet in hand and two others at it, the cups wait for your side bet.
  function callOut(S, T, caller, kind, ev) {
    const b = lastBid(T);
    ev.push({ t: 'call', who: caller, id: T.seats[caller].id, name: nameOf(T, caller), kind, on: { who: b.who, id: T.seats[b.who].id, q: b.q, f: b.f } });
  }
  const sideBetOn = (S, T, caller) => has(S, 'sidebet') && T.ante > 0 && !T.lesson && caller !== 0 && lastBid(T).who !== 0;
  // o: { dbl: Double or Nothing on your Liar call, called: the call was said already, side: your side bet ('bidder'|'caller'|null) }
  function challenge(S, T, caller, kind, ev, o) {
    o = o || {};
    const R = T.round, b = lastBid(T), bidder = b.who, wild = isWild(T), L = T.rule === 'sudden' ? 2 : 1;
    if (!o.called) callOut(S, T, caller, kind, ev);
    const li = b.f === 6 ? loadedAt(T) : -1;
    const count = countFace(T, b.f, bidder), good = count >= b.q, exact = count === b.q;
    const ones = T.seats[0].out ? 0 : T.seats[0].dice.filter(d => d === 1).length;
    const reveal = { t: 'reveal', kind, caller, bidder, q: b.q, f: b.f, wild, count, good, exact, cups: alive(T).map(k => ({ who: k, id: T.seats[k].id, dice: T.seats[k].dice.slice() })) };
    if (li >= 0) reveal.loaded = li; // your loaded six, counted twice
    ev.push(reveal);
    const start = ev.length;
    let winner = -1, loser = -1, n = L, opener;
    if (kind === 'liar') {
      if (good) { winner = bidder; loser = caller; } else { winner = caller; loser = bidder; }
      if (caller === 0 && o.dbl) { n = (good ? DOUBLE_RISK : 2) * L; ev.push({ t: 'trick', id: 'double', who: loser, n, left: doubleLeft(T) }); }
      if (good && bidder === 0 && has(S, 'honest')) { n = 2 * L; ev.push({ t: 'trick', id: 'honest', who: caller, n }); }
      if (!good && bidder === 0 && count === b.q - 1 && has(S, 'close')) { n = 0; ev.push({ t: 'trick', id: 'close' }); }
    } else if (exact) { winner = caller; } else { loser = caller; }
    // Money, when you are a party.
    const party = caller === 0 || (kind === 'liar' && bidder === 0);
    if (party) {
      const a = T.ante;
      if (winner === 0) {
        const bonus = Math.min(S.streak, 3);
        if (kind === 'spot') pay(S, ev, a * 3, 'spot');
        else pay(S, ev, a, 'won');
        if (bonus) pay(S, ev, a * bonus, 'streak');
        if (kind === 'liar' && has(S, 'sticky') && a) { ev.push({ t: 'trick', id: 'sticky', amount: a }); pay(S, ev, a, 'sticky'); }
        if (has(S, 'snake') && a && ones) { ev.push({ t: 'trick', id: 'snake', ones, amount: a * ones }); pay(S, ev, a * ones, 'snake'); }
        S.streak++; S.stats.won++; S.stats.bestStreak = Math.max(S.stats.bestStreak, S.streak);
        T.hot = true;
        S.stats.antes += a;
      } else {
        pay(S, ev, -a, 'lost');
        S.streak = 0; S.stats.lost++;
      }
    }
    // Side Bet: you said who was right in a challenge between two others.
    if (o.side) {
      const right = kind === 'liar' ? (o.side === 'bidder') === good : (o.side === 'caller') === exact;
      const amount = right ? T.ante : -Math.min(S.cash, T.ante * SIDE_STAKE);
      ev.push({ t: 'trick', id: 'sidebet', pick: o.side, right, amount });
      if (amount) pay(S, ev, amount, 'side');
    }
    if (kind === 'liar' && caller === 0 && !good) { S.stats.caught++; T.rec.caught.push(T.seats[bidder].id); }
    if (kind === 'liar' && bidder === 0 && !good) { S.stats.caughtBy++; T.rec.caughtBy.push(T.seats[caller].id); }
    if (kind === 'spot' && caller === 0) { if (exact) { S.stats.spots++; T.rec.spots++; } else S.stats.spotMiss++; }
    if (winner >= 0 && kind === 'spot') {
      const seat = T.seats[caller];
      if (seat.n < T.start[caller]) { seat.n++; }
      ev.push({ t: 'gain', who: caller, id: seat.id, left: seat.n });
      opener = caller;
    }
    if (loser >= 0) { loseDice(S, T, loser, n, ev); opener = loser; }
    T.nextOpener = opener;
    // What they had.
    const readout = { t: 'readout', bids: R.bids.map(x => ({ who: x.who, id: T.seats[x.who].id, name: nameOf(T, x.who), q: x.q, f: x.f, held: x.held, p: Math.round(x.p * 1000) / 1000, bluff: x.bluff, habit: x.habit ? x.habit.i : null, text: x.habit ? x.habit.text : null })) };
    R.bids.forEach(x => { T.seen[x.who].n++; if (x.bluff) T.seen[x.who].b++; });
    ev.push(readout);
    const barks = barksFor(S, T, { kind, caller, bidder, good, exact, winner, loser }, ev.slice(start));
    ev.push(...barks);
    T.last = { reveal: clone(reveal), readout: clone(readout), lines: clone(barks) };
    T.round = null;
    const me = T.seats[0];
    if (me.out) return tableEnd(S, T, me.place, ev);
    if (alive(T).length === 1) return tableEnd(S, T, 1, ev);
    T.wait = 'next';
  }

  function tableEnd(S, T, place, ev) {
    let payout = 0, refund = 0;
    const won = place === 1;
    if (won) {
      payout = T.pot;
      if (has(S, 'housemoney')) { const extra = Math.round(T.pot * 0.25); payout += extra; ev.push({ t: 'trick', id: 'housemoney', extra }); }
      if (T.onTab) payout -= T.buyIn;
      pay(S, ev, payout, 'pot');
    } else if (place === 2 && T.seats.length === 4 && !T.onTab) { refund = T.buyIn; pay(S, ev, refund, 'refund'); }
    const people = T.seats.slice(1).map(s => s.id);
    // Everything this table did to your cash: buy-in, antes, bonuses, pot, refund.
    // (A night saved before tables kept cash0 falls back to buy-in, pot and refund alone.)
    const net = T.cash0 != null ? S.cash - T.cash0 : payout + refund - (T.onTab ? 0 : T.buyIn);
    S.log.push({ hour: T.hour, kind: T.kind, rule: T.rule, people, place, won, payout, refund, net, buyIn: T.buyIn, onTab: T.onTab, rounds: T.rec.rounds, caught: T.rec.caught, caughtBy: T.rec.caughtBy, spots: T.rec.spots, cash: S.cash });
    ev.push({ t: 'tableEnd', hour: T.hour, kind: T.kind, place, won, payout, refund, net, rounds: T.rec.rounds, people, cash: S.cash });
    S.table = null;
    if (T.kind === 'last') return endNight(S, won ? 'house' : 'cleaned', ev);
    openShop(S, ev);
  }

  function endNight(S, ending, ev) {
    S.phase = 'over'; S.ending = ending; S.table = null; S.shop = null;
    ev.push({ t: 'nightEnd', ending, cash: S.cash, share: shareLine(S) });
  }

  // ----- the back room -----
  function price(S, id, hour) {
    const raw = PRICE[TRICK[id].rarity] * PRICE_HOUR[clamp(hour, 0, 3)] * (has(S, 'friends') ? 0.75 : 1);
    return Math.max(5, Math.round(raw / 5) * 5);
  }
  // Curtis's offers: three, four with Friends Rates (never a trick you hold, rarer ones less often).
  function drawOffers(S) {
    let pool = TRICKS.filter(t => !holds(S, t.id)).map(t => t.id);
    const out = [], want = holds(S, 'friends') ? FRIENDS_OFFERS : OFFERS;
    while (out.length < want && pool.length) {
      const tot = sum(pool.map(id => WEIGHT[TRICK[id].rarity]));
      let x = rnd(S) * tot, k = 0;
      for (; k < pool.length - 1; k++) { x -= WEIGHT[TRICK[pool[k]].rarity]; if (x < 0) break; }
      out.push(pool[k]); pool = pool.filter((id, j) => j !== k);
    }
    return out;
  }
  function openShop(S, ev) {
    S.phase = 'shop';
    S.rng = hash(S.seed + '|shop|' + S.hour, 5);
    S.shop = { hour: S.hour, offers: drawOffers(S), rerolls: 0 };
    const v = shopView(S);
    ev.push({ t: 'shop', hour: S.hour, offers: v.offers, rerollPrice: v.rerollPrice });
  }
  // The tricks you hold that share a build with id.
  const goesWith = (S, id) => partnersOf(id).filter(x => holds(S, x));
  function shopView(S) {
    if (S.phase !== 'shop' || !S.shop) return null;
    const h = S.shop.hour;
    return {

    /* A night just ended: the record, and what it added. */
    record(S) {
      const L = this.data, before = this.rank(L.best);

  const Claude = {
