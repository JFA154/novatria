    }
  };

  // =====================================================================
  // Pearl's column (end of the night) and table talk (after a reveal)
  // =====================================================================
  const Column = {
    night: null, state: 'idle',
    async start(S) {
      if (this.night === S.night + '|' + S.ending) return;
      this.night = S.night + '|' + S.ending; this.state = 'idle';
      const note = $('col-note');
      if (!Claude.key()) return;
      this.state = 'asking';
      const tag = this.night;
      try {
        const r = await Claude.call(Claude.COLUMN_SYSTEM, Engine.columnFacts(S), Claude.COLUMN_SCHEMA, 700);
        const head = clip(r.headline, 14, 120).replace(/[.]$/, ''), body = clip(r.body, 170, 1400);
        if (this.night !== tag || !head || !body || !$('col-head')) { this.state = 'dropped'; return; }
        const col = $('column');
        col.setAttribute('data-fading', '');
        await new Promise(res => setTimeout(res, instant() || Motion.reduce ? 0 : 380));
        $('col-head').textContent = head; $('col-body').textContent = body; $('col-by').textContent = 'By Pearl Gentry';
        const n = $('col-note'); n.hidden = false; n.textContent = `Written by Claude (${MODEL_NAMES[Settings.model].replace(/ \(.*\)$/, '')}) from the night’s facts.`;
        col.removeAttribute('data-fading'); col.dataset.by = 'claude';
        this.state = 'done';
      } catch (e) {
        this.state = 'failed';
        if (e && e.type === 'auth' && note && this.night === tag) { note.hidden = false; note.textContent = 'Claude refused the API key, so this is Pearl’s usual column.'; }
      }
    }
  };
  const Talk = {
    busy: false, dropped: 0, landed: 0,
    maybe(events) {
      const rv = events.find(e => e.t === 'reveal');
      if (!rv || !Claude.key() || !Settings.talk || Speed.k === 0 || this.busy || !App.state) return;
      const facts = Engine.talkFacts(App.state, events.slice(events.findIndex(e => e.t === 'call')));
      if (!facts) return;
      const ids = rv.cups.map(c => c.id).filter(id => id !== 'me' && PEOPLE[id]);
      const seq = TV.revealSeq, key = TV.key;
      this.busy = true;
      Claude.call(Claude.TALK_SYSTEM, `${facts}\nThe people's ids: ${ids.map(id => `${id} = ${PEOPLE[id].name}`).join('; ')}.`, Claude.TALK_SCHEMA, 300)
        .then(r => {
          const lines = (Array.isArray(r.lines) ? r.lines : []).filter(l => isObj(l) && ids.includes(l.id)).slice(0, 2).map(l => ({ id: l.id, say: clip(l.say, 14, 140) })).filter(l => l.say);
          const up = Sheet.cur && Sheet.cur.dataset.seq === String(seq) && TV.key === key && TV.revealSeq === seq;
          if (!up || !lines.length) { this.dropped++; return; }
          // Claude's lines replace the scripted barks.
          TV.seats.forEach(s => { if (s && s.bubble.dataset.kind === 'say') s.clearTalk(); });
          const used = new Set();
          for (const l of lines) {
            if (used.has(l.id)) continue; used.add(l.id);
            const s = TV.seats.find(x => x && x.id === l.id);
            if (s) s.sayLine(l.say, 'claude');
          }
          this.landed++;
        })
        .catch(() => { this.dropped++; })
        .finally(() => { this.busy = false; });
    }
  };

  // =====================================================================
  // Game.App: everything the buttons do goes through here
  // =====================================================================
  const UI = { after: null, endInfo: null };
  let rec = null;      // the night: { v, S, coach, metBefore, started }
  let busy = false;
  let queue = Promise.resolve();
  let navGen = 0;      // bumped when the player leaves for the home screen mid-animation
  const persist = () => { if (rec) Night.save(rec); };
  // The Book the night plays with: yours, or on a Blind night tonight's own (it starts clean; yours still keeps it all).
  const bookNow = () => (rec && rec.nightBook && rec.S && rec.S.start === 'blind' ? rec.nightBook : Book.data);
  // Kept in memory too, so a night survives leaving to the home screen with storage switched off.
  const nightSave = Night.save.bind(Night), nightLoad = Night.load.bind(Night), nightClear = Night.clear.bind(Night);
  Night.save = r => { Night.mem = r; nightSave(r); };
  Night.load = () => nightLoad() || (Night.mem && Night.mem.S && Night.mem.S.phase !== 'over' ? Night.mem : null);
  Night.clear = () => { Night.mem = null; nightClear(); };

  const App = {
    get speed() { return Speed.k; },
    set speed(k) { Speed.k = Math.max(0, Number(k) || 0); },
    get state() { return rec ? rec.S : null; },
    get busy() { return busy; },
    lastCopied: null,
    /* Resolves when every action sent so far has been drawn. */
    idle() { return queue.then(() => undefined); },
    now: () => new Date(),
    view() { return rec ? Engine.view(rec.S) : null; },
    /* A new night: { seed, daily (true for tonight's, or 'YYYY-MM-DD'), tips (the first-table coach), tricks (tests),
       room (an After Hours rung; default: the home screen's pick), start (a way to walk in; default: the home screen's
       pick), grudges (false: none tonight) }. Rooms, starts and grudges only once the house has been beaten, and never
       on tonight's tables (the same for everyone). */
    start(opts) {
      opts = opts || {};
      Stage.reset(); Dialog.close(); navGen++; Lesson.off();
      const daily = opts.daily === true ? dayKey(App.now()) : typeof opts.daily === 'string' ? opts.daily : null;
      const seed = opts.seed !== undefined ? opts.seed : daily ? undefined : ((Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0).toString(36);
      const after = !daily && Ledger.data.house > 0;
      const room = after ? clamp(opts.room !== undefined ? opts.room | 0 : Pick.room(), 0, Ledger.open()) : 0;
      const startId = after ? (opts.start !== undefined ? opts.start : Pick.start()) : null;
      const start = startId && Ledger.starts().some(x => x.id === startId) ? startId : null;
      const S = Engine.newNight({ seed, daily, book: Book.data, tricks: opts.tricks, room, start, grudges: after && opts.grudges !== false });
      const coach = opts.tips === undefined ? !Settings.tipsDone && !Ledger.data.nights : !!opts.tips;
      // A player's very first night deals them straight into the 9 PM near table; the choice waits for 10 PM.
      const firstNight = opts.first !== undefined ? !!opts.first : opts.tips === undefined && !Ledger.data.nights;
      rec = { v: Engine.VERSION, S, coach, first: firstNight, metBefore: Book.metIds(), started: Date.now() };
      // Blind: a clean Book for the night (tonight's own pages, from nothing).
      if (S.start === 'blind') rec.nightBook = Engine.bookApply(null, []);
      Night.rec = rec;
      if (!Settings.played) { Settings.played = true; Settings.save(); }
      UI.after = null; UI.endInfo = null; TV.key = '';
      bookShown = bookNow();
      persist();
      if (firstNight && S.phase === 'choose' && S.hour === 0) App.act({ t: 'sit', i: 0 });
      else Screens.render();
      return S;
    },
    resume() {
      const r = Night.load();
      if (!r) { App.home(); return false; }
      Stage.reset(); Dialog.close(); navGen++; Lesson.off();
      rec = r; Night.rec = rec; UI.after = null; TV.key = '';
      bookShown = bookNow();
      Screens.render();
      return true;
    },
    /* The one way the night moves: an engine action, saved at once, then drawn. Resolves when the drawing is done. */
    act(action) {
      if (Lesson.on) return Lesson.act(action);
      const run = async () => {
        if (!rec) return [{ t: 'error', msg: 'no night in progress' }];
        const S = rec.S, nav = navGen, bookBefore = bookNow();
        let ev;
        try { ev = Engine.act(S, action); } catch (err) { ev = [{ t: 'error', msg: String(err && err.message) }]; }
        if (!ev.length || ev[0].t === 'error') { if (Screens.cur === 'table') Toast.show(cap(ev[0] ? ev[0].msg : 'nothing happened')).catch(() => {}); return ev; }
        UI.after = null;
        Book.apply(ev);
        if (rec.nightBook) rec.nightBook = Engine.bookApply(rec.nightBook, ev);
        // (Loretta gone quiet tonight: a feat's fact.)
        if (ev.some(e => e.t === 'gear')) rec.quiet = true;
        if (ev.some(e => e.t === 'nightEnd')) {
          UI.endInfo = Object.assign(Ledger.record(S, rec), { newlyMet: Book.metIds().filter(id => !rec.metBefore.includes(id)) });
          Night.clear();
        } else persist();
        if (ev.some(e => e.t === 'sit')) show('table');
        busy = true;
        bookShown = bookBefore;
        try { if (Screens.cur === 'table') await play(ev); } catch (err) { if (err !== ABORT) console.error(err); }
        busy = false;
        bookShown = bookNow();
        if (nav !== navGen || !rec || rec.S !== S) return ev;
        const te = ev.find(e => e.t === 'tableEnd');
        if (te) UI.after = { e: te, reveal: ev.find(e => e.t === 'reveal') || null, readout: ev.find(e => e.t === 'readout') || null, losses: TV.lastLoss.slice() };
        Screens.render();
        if (ev.some(e => e.t === 'reveal')) Talk.maybe(ev);
        return ev;
      };
      const p = queue.then(run, run);
      queue = p.catch(() => {});
      return p;
    },
    /* From the end-of-table beat to the back room (or the end of the night). */
    leaveTable() { UI.after = null; Sheet.clear(); Screens.render(); },
    home() {
      Stage.reset(); Dialog.close(); navGen++; Lesson.off();
      busy = false; rec = null; Night.rec = null; UI.after = null;
      Coach.hide();
      Screens.home();
    },
    confirmNew(fn) {
      const saved = Night.load();
      if (!saved) { fn(); return; }
      const v = Engine.view(saved.S);
      Dialog.open([el('h2', null, 'Start a new night?'), el('p', null, `The night in progress (${v.hourName}, ${money(v.cash)}) will be lost.`)], [['Keep it', null], ['Start a new one', fn, 'primary', 'btn-confirm-new']]);
    },
    async copy(text, noteId) {
      App.lastCopied = text;
      let ok = false;
      try { await Promise.race([navigator.clipboard.writeText(text), new Promise((res, rej) => setTimeout(() => rej(new Error('slow')), 1500))]); ok = true; } catch (e) { ok = false; }
      const n = $(noteId); if (n) n.textContent = ok ? 'Copied.' : `Copy this: ${text}`;
      return ok;
    }
  };

  // =====================================================================
  // The practice hand ("Learn it in a minute"): a scripted little table on the real table screen.
  // The engine sets it (Engine.lesson: fixed cups, fixed moves for the people); the lesson plays its
  // events in pieces with a line of teaching between them, and the player moves it on with the real
  // buttons (only the one the step asks for is live) or "Next". It costs nothing and keeps nothing:
  // its state is never saved, never goes into the Book or the ledger, and leaving it is going home.
  // =====================================================================
  const LESSON_STEPS = {
    a: { cups: 'open', next: 'b', text: () => 'Everyone has dice under a cup. Normally you see only your own. For this hand, every cup is open.',
      async enter(L) { await L.playTo(e => e.t === 'roll'); L.point(['.seat .tray', '#mycup .cupdice']); } },
    b: { cups: 'open', next: 'b2', text: () => ['Glenda bids ', el('b', null, 'four 3s'), '. A bid is a claim about all the dice on the table together: at least four 3s.'],
      async enter(L) { await L.playTo(e => e.t === 'bid'); L.point(['#bid']); } },
    b2: { cups: 'open', next: 'c', text: () => ['Ones are wild: they count as 3s too. Count the 3s and 1s in every cup: ', el('b', null, 'five'), '. Her bid is true.'],
      async enter(L) { await L.tally(4, 3); L.point(['#bid']); } },
    c: { cups: 'open', wants: { t: 'liar' }, then: 'c2', text: () => ['Gerald raises to ', el('b', null, 'six 3s'), '. Every bid must beat the last. You counted five, so he is lying. Press ', el('b', null, 'Liar!')],
      async enter(L) { L.unmark(); await L.playTo(null); L.sync(); L.lock(['btn-liar']); L.point(['#btn-liar']); } },
    c2: { cups: 'open', next: 'd', engine: { t: 'next' }, text: () => 'Caught. Whoever is wrong loses a die; lose them all and you are out. The last cup with dice wins the table’s money.',
      async enter(L) { await L.playTo(null); L.sync(); L.point([]); } },
    d: { cups: 'shut', next: 'd2', text: () => 'Now for real: a new roll, and their cups are shut. You judge from your own dice.',
      async enter(L) { await L.playTo(e => e.t === 'roll'); L.point(['#mycup .cupdice']); } },
    d2: { cups: 'shut', next: 'd3', text: () => ['Gerald lost, so he starts: ', el('b', null, 'two 5s'), '. The ', el('b', null, 'Count'), ' is the chance a bid is true, worked out from your dice.'],
      async enter(L) { await L.playTo(null); L.sync(); Picker.close(); L.point(['#countbar']); } },
    d3: { cups: 'shut', wants: { t: 'bid', q: 4, f: 5 }, then: 'd4',
      text: L => [`It says ${pct(L.count())}: you hold three 5s yourself. Don’t call that. Raise: press `, el('b', null, 'Bid'), '.'],
      async enter(L) { L.sync(); Picker.q = 4; Picker.f = 5; Picker.touched = true; Picker.render(); L.lock(['btn-bid']); L.point(['#countbar', '#btn-bid']); } },
    d4: { cups: 'shut', wants: { t: 'liar' }, then: 'e',
      text: L => ['Glenda says five, Gerald ', el('b', null, 'seven 5s'), `. The Count says ${pct(L.count())}: almost surely a lie. Press `, el('b', null, 'Liar!')],
      async enter(L) { await L.playTo(e => e.t === 'bid' && e.who === 1); await wait(350); await L.playTo(null); L.sync(); L.lock(['btn-liar']); L.point(['#countbar', '#btn-liar']); } },
    e: { cups: 'shut', next: 'e2', text: L => [`Caught again: only ${word(L.revealed())}. See the line under Gerald? Everyone has habits, and one tends to show when they bluff.`],
      async enter(L) { await L.playTo(null); L.sync(); L.showHabit(); L.point(['habit']); } },
    e2: { cups: 'shut', next: 'f', text: () => ['Your ', el('b', null, 'Book'), ' counts every habit against what the cups showed, so you learn people over time.'],
      async enter(L) { L.showBook(); L.point(['#bookline']); } },
    f: { cups: 'shut', end: true, text: () => 'Count low: think Liar. Otherwise raise. Win a table and you take its pot. You start with $100; reach $500 by Last Call and you play the house for triple.',
      async enter(L) { L.finish(); } }
  };
  const LESSON_ORDER = Object.keys(LESSON_STEPS);
  const Lesson = {
    on: false, ready: false, step: null, ev: [], at: 0, gen: 0, habit: null, started: 0,
    /* Sit down at the practice table. */
    start() {
      Stage.reset(); Dialog.close(); navGen++;
      const L = Engine.lesson();
      rec = { v: Engine.VERSION, S: L.S, lesson: true, coach: false, first: false, metBefore: [], started: Date.now() };
      Night.rec = rec; UI.after = null; UI.endInfo = null; TV.key = '';
      bookShown = null; busy = false;
      this.on = true; this.gen++; this.ev = L.events; this.at = 0; this.habit = null; this.started = Date.now();
      $('screen-table').setAttribute('data-lesson', 'open');
      Table.toggleBook(false);
      show('table');
      return this.run(g => this.go('a', g));
    },
    /* Out of the lesson (home, a real night): nothing of it stays. */
    off() {
      if (!this.on && !$('screen-table').hasAttribute('data-lesson')) return;
      this.on = false; this.ready = false; this.gen++; this.step = null; this.ev = []; this.at = 0;
      const scr = $('screen-table'); scr.removeAttribute('data-lesson');
      const card = $('lesson'); if (card) { card.hidden = true; card.replaceChildren(); delete card.dataset.step; }
      $('lesson-go').hidden = true; Picker.calls.hidden = false;
      this.point([]); Sheet.clear();
      if (rec && rec.lesson) { rec = null; Night.rec = null; }
    },
    /* Every move of the lesson goes through the queue, so App.idle() waits for it too. */
    run(fn) {
      const g = this.gen;
      const p = queue.then(() => (g === this.gen ? fn(g) : undefined));
      queue = p.catch(err => { if (err !== ABORT) console.error(err); });
      return p.catch(err => { if (err !== ABORT) throw err; });
    },
    async go(id, g) {
      const st = LESSON_STEPS[id];
      if (!st || g !== this.gen) return;
      this.step = id;
      $('screen-table').setAttribute('data-lesson', st.cups);
      const card = $('lesson');
      card.dataset.step = id; card.setAttribute('data-wait', ''); this.ready = false;
      const b = $('btn-lesson-next'); if (b) b.disabled = true;
      await st.enter(this);
      if (g !== this.gen || st.end) return;
      this.card(st);
    },
    /* The line of teaching above the controls; Next stands where Liar and Spot on do, until a step wants them. */
    card(st) {
      const card = $('lesson');
      card.replaceChildren(el('p', { id: 'lesson-text' }, st.text(this)));
      card.hidden = false; card.removeAttribute('data-wait'); this.ready = true;
      this.bar(st);
      say(cleanText(card.textContent));
      anim(card, [{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], 200, { move: true });
      if (st.next) { try { $('btn-lesson-next').focus({ preventScroll: true }); } catch (e) { /* ok */ } }
    },
    /* The top bar's step count, and Next in place of the calls on a Next step. */
    bar(st) {
      $('t-hour').replaceChildren(...tableHour(0));
      const go = $('lesson-go');
      go.hidden = !(st && st.next);
      Picker.calls.hidden = !go.hidden;
      const b = $('btn-lesson-next'); if (b) b.disabled = false;
    },
    next() {
      const st = LESSON_STEPS[this.step];
      if (!st || !st.next || busy || $('btn-lesson-next').disabled) return Promise.resolve();
      $('btn-lesson-next').disabled = true;
      return this.run(async g => {
        if (st.engine) { this.ev = Engine.act(rec.S, st.engine); this.at = 0; }
        await this.go(st.next, g);
      });
    },
    /* The table's own buttons, in the lesson: only the move the step asks for. */
    act(action) {
      const st = LESSON_STEPS[this.step], w = st && st.wants;
      const ok = w && !busy && action && action.t === w.t && !action.double && (w.t !== 'bid' || (action.q === w.q && action.f === w.f));
      if (!ok) { if (st && w) { this.sync(); if (w.t === 'bid') { Picker.q = w.q; Picker.f = w.f; Picker.render(); } this.relock(); } return Promise.resolve([{ t: 'error', msg: 'not in the lesson' }]); }
      this.point([]);
      return this.run(async g => {
        this.ev = Engine.act(rec.S, action); this.at = 0;
        await this.go(st.then, g);
        return this.ev;
      });
    },
    relock() { const st = LESSON_STEPS[this.step]; if (st && st.wants) this.lock([st.wants.t === 'bid' ? 'btn-bid' : 'btn-liar']); },
    /* Plays the lesson's events up to and including the first that matches (all of them for null). */
    async playTo(pred) {
      let j = this.at;
      while (j < this.ev.length - 1 && !(pred && pred(this.ev[j]))) j++;
      const slice = this.ev.slice(this.at, j + 1);
      this.at = j + 1;
      slice.forEach(e => { if (e.t === 'bid' && e.habit) this.habit = e; });
      const g = this.gen;
      busy = true;
      try { await play(slice); } catch (err) { if (err !== ABORT) console.error(err); } finally { if (g === this.gen) busy = false; }
      if (g !== this.gen) throw ABORT;
    },
    sync() { Table.sync(Engine.view(rec.S)); },
    count() { const v = Engine.view(rec.S); return v.table && v.table.count !== null ? v.table.count : 0; },
    revealed() { const r = this.ev.find(e => e.t === 'reveal'); return r ? r.count : 0; },
    lock(allow) {
      document.querySelectorAll('#picker button').forEach(b => { b.disabled = !allow.includes(b.id); });
      $('picker').removeAttribute('data-calm');
    },
    /* What the step talks about, ringed: CSS selectors, or 'habit' (the habit line that came with the bluff). */
    point(list) {
      document.querySelectorAll('[data-point]').forEach(n => n.removeAttribute('data-point'));
      list.forEach(q => {
        if (q === 'habit') { const s = this.habit ? seatOf(this.habit.who) : null; if (s) s.habitEl.setAttribute('data-point', ''); return; }
        document.querySelectorAll('#screen-table ' + q).forEach(n => n.setAttribute('data-point', ''));
      });
    },
    /* Step B: every die that counts for four 3s lit, in every cup, and the tally climbing. */
    async tally(q, f) {
      const cups = Engine.view(rec.S).table.cups;
      BidBanner.counter(q, f);
      let n = 0;
      const order = [1, 2, 0];
      for (const k of order) {
        const dice = cups[k] || [];
        const nodes = k === 0 ? MyCup.nodes : [...seatOf(k).tray.children];
        dice.forEach((d, i) => { if (nodes[i]) { nodes[i].toggleAttribute('data-dim', !(d === f || d === 1)); } });
        for (let i = 0; i < dice.length; i++) {
          if (!(dice[i] === f || dice[i] === 1) || !nodes[i]) continue;
          n++;
          nodes[i].setAttribute('data-hit', '');
          anim(nodes[i], [{ transform: 'scale(1)' }, { transform: 'scale(1.4) rotate(-8deg)', offset: .4 }, { transform: 'scale(1)' }], 260, { move: true, easing: 'ease-out' });
          BidBanner.tick(n, n >= q ? 'there' : null);
          Sfx.play('tick', n);
          await wait(170);
        }
      }
      $('bid').dataset.tally = String(n);
    },
    unmark() {
      const v = Engine.view(rec.S).table;
      TV.seats.forEach((s, k) => { if (s && v.cups && v.cups[k]) s.renderUp(v.cups[k]); });
      MyCup.nodes.forEach(d => { d.removeAttribute('data-hit'); d.removeAttribute('data-dim'); });
      delete $('bid').dataset.tally;
    },
    /* Step E: Gerald's habit, back under his seat (the bark that followed it had cleared it). */
    showHabit() {
      const h = this.habit ? this.habit.habit : null;
      const s = this.habit ? seatOf(this.habit.who) : null;
      if (s && h) s.setHabit(h.text, false);
    },
    /* Step E2: the Book line under the Count, now that the cups have said it was a bluff. */
    showBook() {
      if (!this.habit) return;
      BookLine.set(this.habit.id, this.habit.habit, bookShown);
    },
    /* The end: what the night is, and a real seat (or home). */
    finish() {
      Settings.lesson = 'done'; Settings.save();
      this.point([]); $('lesson').hidden = true; $('lesson').replaceChildren(); $('lesson-go').hidden = true;
      const back = el('button', { class: 'btn lesson-back', type: 'button', id: 'btn-lesson-back', onclick: () => App.home() }, 'Back');
      const node = Sheet.show([el('div', { class: 'lesson-end' }, el('h2', null, 'That’s the whole game'), el('p', { id: 'lesson-text' }, LESSON_STEPS.f.text(this)))], 'Sit down for real', () => App.start({}), 'btn-lesson-real');
      node.append(back);
      node.dataset.kind = 'lesson';
      say(LESSON_STEPS.f.text(this));
    },
    skip() { if (!Settings.lesson) { Settings.lesson = 'skipped'; Settings.save(); } App.home(); }
  };

  // ----- Keys: Enter/Space for Continue, and the picker's letters -----
  function onKey(e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    if (Dialog.isOpen) return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (Screens.cur !== 'table' || Lesson.on) return;
    const onButton = tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY';
    if (e.key === 'Enter' || e.key === ' ') {
      if (busy) { Skip.now(); e.preventDefault(); return; }
      if (onButton) return;
      const go = (Sheet.cur && Sheet.cur.querySelector('.go')) || (!$('bar').hidden && $('btn-go'));
      if (go && !go.disabled) { e.preventDefault(); go.click(); }
      return;
    }
    if (!Picker.ctx || busy) return;
    const k = e.key.toLowerCase();
    if (k === 'l' && !Picker.liar.disabled) { e.preventDefault(); Picker.liar.click(); }
    else if (k === 'd' && !Picker.liar2.hidden && !Picker.liar2.disabled) { e.preventDefault(); Picker.liar2.click(); }
    else if (k === 's' && !Picker.spot.disabled) { e.preventDefault(); Picker.spot.click(); }
    else if (k === 'b' && !Picker.bidBtn.disabled) { e.preventDefault(); Picker.bidBtn.click(); }
    else if ((k === '+' || k === '=' || k === 'arrowup') && !onButton) { e.preventDefault(); Picker.step(1); }
    else if ((k === '-' || k === 'arrowdown') && !onButton) { e.preventDefault(); Picker.step(-1); }
    else if (/^[1-6]$/.test(k) && TV.faces.includes(Number(k))) { e.preventDefault(); Picker.pickFace(Number(k)); }
  }

  function init() {
    Settings.load(); Speed.k = Settings.speed; Sfx.setMuted(!Settings.sound); applyTheme();
    Book.load(); Ledger.load();
    Fx.layer = $('fx');
    Table.build();
    document.addEventListener('keydown', onKey);
    const d = $('dlg');
    d.addEventListener('close', () => { d.replaceChildren(); });
    d.addEventListener('click', e => { if (e.target === d) d.close(); });
    Screens.home();
  }

  Object.assign(Game, {
    App,
    Book: { get data() { return Book.data; }, page: id => Engine.bookPage(Book.data, id), met: id => Book.met(id) },
    Ledger: { get data() { return Ledger.data; }, rank: best => Ledger.rank(best), RANKS: RANKS.map(r => r.slice()) },
    UI: { Settings, Coach, Talk, Column, Claude, Table, Screens, TV, Picker, Tricks, People, Menu, Lesson, Ledger, Book, Pick, show, get after() { return UI.after; } }
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</head>

<div id="app">
  <section id="screen-home" class="screen page active" aria-labelledby="home-title"><div class="home"><h1 id="home-title" class="logo">B<span class="logo-o">o</span>nes</h1></div></section>
  <section id="screen-choose" class="screen page" aria-labelledby="choose-title"></section>
  <section id="screen-table" class="screen" aria-label="The table"></section>
  <section id="screen-shop" class="screen page" aria-labelledby="shop-title"></section>
  <section id="screen-over" class="screen page" aria-labelledby="over-title"></section>
  <section id="screen-book" class="screen page" aria-labelledby="book-title"></section>
</div>
<div class="fx" id="fx"></div>
<div class="visually-hidden" id="say" aria-live="assertive"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
</body>
