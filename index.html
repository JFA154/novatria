    for (let q = cur.q; q <= Math.min(total, cur.q + 2); q++) for (const f of faces) if (higher(q, f, cur)) cands.push({ q, f, b: believe(q, f), x: exactP(q, f) });
    if (!cands.length) return { t: 'liar' };
    // A close call is not worth making while a raise it likes is there (most of all on
    // the round's first bid: hardly anyone calls the opener).
    const credit = CREDIT * (R.bids.length === 1 ? 1 : 0.5) * (1 - SHARP * per.skill);
    if (pc < thr && !(pc >= thr - credit && cands.some(c => c.q <= cur.q + 1 && c.b >= RAISE_OK))) return { t: 'liar' };
    // Where it would like the bid to be. When the bid in front is well below that, it
    // jumps there rather than creep up by the minimum.
    const target = comfort(conf);
    const far = !!target && higher(target.q, target.f, cur) && target.q >= cur.q + 2;
    const top = far ? target.q : cur.q + 1;
    if (rnd(S) < bluffy) {
      // A good liar only tells a lie that looks true from outside; a poor one tells the first that comes.
      const stretch = [];
      for (let q = cur.q; q <= Math.min(total, top); q++) for (const f of faces) if (higher(q, f, cur) && exactP(q, f) < BLUFF_P) stretch.push({ q, f, x: exactP(q, f) });
      if (stretch.length) {
        if (rnd(S) >= per.skill) return { t: 'bid', q: stretch[0].q, f: stretch[0].f };
        const c = stretch.filter(k => look(k) >= LOOK).sort((a, b) => look(b) - look(a))[0];
        if (c) return { t: 'bid', q: c.q, f: c.f };
      }
    }
    if (far && rnd(S) < JUMP) {
      const j = target.q - 1 > cur.q && rnd(S) < JUMP_DROP && exactP(target.q - 1, target.f) <= TRIVIAL ? { q: target.q - 1, f: target.f } : reach(target);
      if (!quiet || exactP(j.q, j.f) >= BLUFF_P) return { t: 'bid', q: j.q, f: j.f };
    }
    // The smallest raise it believes, passing over sure things that say nothing when it can.
    const liked = cands.filter(c => c.b >= 0.5 - over), real = liked.filter(c => c.x <= TRIVIAL);
    // An honest player prefers a raise its own cup backs (so it does not bluff by accident).
    const backed = (real.length ? real : liked).filter(c => c.x >= BLUFF_P);
    const good = backed.length && rnd(S) >= bluffy ? backed : real.length ? real : liked;
    // With nothing its own cup backs, an honest player would sooner call than stretch.
    if (good.length && !backed.length && (quiet || rnd(S) < HONEST * (1 - bluffy / 0.5))) return { t: 'liar' };
    if (good.length) {
      const minQ = good[0].q;
      let c = good[0];
      if (rnd(S) < per.skill) c = good.filter(g => g.q === minQ).sort((a, b) => b.b - a.b)[0];
      if (rnd(S) < 0.08 + 0.2 * (1 - per.skill)) { const up = cands.find(k => k.f === c.f && k.q === c.q + 1); if (up && (!quiet || up.x >= BLUFF_P)) c = up; }
      return { t: 'bid', q: c.q, f: c.f };
    }
    if (!quiet && rnd(S) < bluffy * 1.5 + 0.1) { const thin = cands.filter(c => c.q <= cur.q + 1).sort((a, b) => b.b - a.b)[0]; if (thin) return { t: 'bid', q: thin.q, f: thin.f }; }
    return { t: 'liar' };
  }

  // ----- challenges -----
  function loseDice(S, T, s, n, ev) {
    const seat = T.seats[s];
    if (s === 0 && n > 0 && has(S, 'rabbit') && !T.used.rabbit) { T.used.rabbit = true; n--; ev.push({ t: 'trick', id: 'rabbit', saved: 1 }); }
    if (n <= 0) return;
    let left = seat.n - n;
    if (left <= 0 && s === 0 && has(S, 'lastword') && !T.used.lastword) { T.used.lastword = true; left = 1; ev.push({ t: 'trick', id: 'lastword' }); }
    left = Math.max(0, left);
    const lostN = seat.n - left;
    seat.n = left; seat.lost += lostN;
    ev.push({ t: 'lose', who: s, id: seat.id, n: lostN, left });
    if (left === 0) {
      seat.out = true; seat.dice = [];
      seat.place = alive(T).length + 1;
      ev.push({ t: 'out', who: s, id: seat.id, name: nameOf(T, s), place: seat.place });
    }
  }

  // The call itself (said out loud). With Side Bet in hand and two others at it, the cups wait for your side bet.
  function callOut(S, T, caller, kind, ev) {
    const b = lastBid(T);
    ev.push({ t: 'call', who: caller, id: T.seats[caller].id, name: nameOf(T, caller), kind, on: { who: b.who, id: T.seats[b.who].id, q: b.q, f: b.f } });
  }
  const sideBetOn = (S, T, caller) => has(S, 'sidebet') && T.ante > 0 && !T.lesson && caller !== 0 && lastBid(T).who !== 0;
  // o: { dbl: Double or Nothing on your Liar call, called: the call was said already, side: your side bet ('bidder'|'caller'|null) }
  function challenge(S, T, caller, kind, ev, o) {
    o = o || {};
    const R = T.round, b = lastBid(T), bidder = b.who, wild = isWild(T), L = T.rule === 'sudden' ? 2 : 1;
    if (!o.called) callOut(S, T, caller, kind, ev);
    const li = b.f === 6 ? loadedAt(T) : -1;
    const count = countFace(T, b.f, bidder), good = count >= b.q, exact = count === b.q;
    const ones = T.seats[0].out ? 0 : T.seats[0].dice.filter(d => d === 1).length;
    const reveal = { t: 'reveal', kind, caller, bidder, q: b.q, f: b.f, wild, count, good, exact, cups: alive(T).map(k => ({ who: k, id: T.seats[k].id, dice: T.seats[k].dice.slice() })) };
    if (li >= 0) reveal.loaded = li; // your loaded six, counted twice
    ev.push(reveal);
    const start = ev.length;
    let winner = -1, loser = -1, n = L, opener;
    if (kind === 'liar') {
      if (good) { winner = bidder; loser = caller; } else { winner = caller; loser = bidder; }
      if (caller === 0 && o.dbl) { n = (good ? DOUBLE_RISK : 2) * L; ev.push({ t: 'trick', id: 'double', who: loser, n, left: doubleLeft(T) }); }
      if (good && bidder === 0 && has(S, 'honest')) { n = 2 * L; ev.push({ t: 'trick', id: 'honest', who: caller, n }); }
      if (!good && bidder === 0 && count === b.q - 1 && has(S, 'close')) { n = 0; ev.push({ t: 'trick', id: 'close' }); }
    } else if (exact) { winner = caller; } else { loser = caller; }
    // Money, when you are a party.
    const party = caller === 0 || (kind === 'liar' && bidder === 0);
    if (party) {
      const a = T.ante;
      if (winner === 0) {
        const bonus = Math.min(S.streak, 3);
        if (kind === 'spot') pay(S, ev, a * 3, 'spot');
        else pay(S, ev, a, 'won');
        if (bonus) pay(S, ev, a * bonus, 'streak');
        if (kind === 'liar' && has(S, 'sticky') && a) { ev.push({ t: 'trick', id: 'sticky', amount: a }); pay(S, ev, a, 'sticky'); }
        if (has(S, 'snake') && a && ones) { ev.push({ t: 'trick', id: 'snake', ones, amount: a * ones }); pay(S, ev, a * ones, 'snake'); }
        S.streak++; S.stats.won++; S.stats.bestStreak = Math.max(S.stats.bestStreak, S.streak);
        T.hot = true;
        S.stats.antes += a;
      } else {
        pay(S, ev, -a, 'lost');
        S.streak = 0; S.stats.lost++;
      }
    }
    // Side Bet: you said who was right in a challenge between two others.
    if (o.side) {
      const right = kind === 'liar' ? (o.side === 'bidder') === good : (o.side === 'caller') === exact;
      const amount = right ? T.ante : -Math.min(S.cash, T.ante * SIDE_STAKE);
      ev.push({ t: 'trick', id: 'sidebet', pick: o.side, right, amount });
      if (amount) pay(S, ev, amount, 'side');
    }
    if (kind === 'liar' && caller === 0 && !good) { S.stats.caught++; T.rec.caught.push(T.seats[bidder].id); }
    if (kind === 'liar' && bidder === 0 && !good) { S.stats.caughtBy++; T.rec.caughtBy.push(T.seats[caller].id); }
    if (kind === 'spot' && caller === 0) { if (exact) { S.stats.spots++; T.rec.spots++; } else S.stats.spotMiss++; }
    if (winner >= 0 && kind === 'spot') {
      const seat = T.seats[caller];
      if (seat.n < T.start[caller]) { seat.n++; }
      ev.push({ t: 'gain', who: caller, id: seat.id, left: seat.n });
      opener = caller;
    }
    if (loser >= 0) { loseDice(S, T, loser, n, ev); opener = loser; }
    // A night that carries grudges remembers who you knocked out (your call was right, or they called your good bid).
    if (S.grudges && loser > 0 && T.seats[loser].out && !T.lesson && (winner === 0 || (bidder === 0 && caller === loser))) (T.ko = T.ko || []).push(T.seats[loser].id);
    T.nextOpener = opener;
    // What they had.
    // Your bids carry their shapes (none under Poker Face: the room takes no notes on an honest face), and the room
    // scores them; a read that decided a call this round is said in plain words.
    const masked = has(S, 'pokerface');
    const readout = { t: 'readout', bids: R.bids.map(x => {
      const o = { who: x.who, id: T.seats[x.who].id, name: nameOf(T, x.who), q: x.q, f: x.f, held: x.held, p: Math.round(x.p * 1000) / 1000, bluff: x.bluff, habit: x.habit ? x.habit.i : null, text: x.habit ? x.habit.text : null };
      if (x.who === 0) o.shape = x.shape && !masked ? x.shape.slice() : null;
      if (x.sit) o.sit = x.sit;
      return o;
    }) };
    // The house tonight: what this night's reveals showed of Loretta and Curtis, by situation (for the end of the night).
    R.bids.forEach(x => {
      if (!x.sit) return;
      const H = S.house = S.house || {}, id = T.seats[x.who].id, P0 = H[id] = H[id] || { bids: 0, bluffs: 0, habits: {} };
      P0.bids++; if (x.bluff) P0.bluffs++;
      if (x.habit) { const k = x.habit.i + '|' + x.sit, c = P0.habits[k] = P0.habits[k] || { n: 0, b: 0 }; c.n++; if (x.bluff) c.b++; }
      else if (x.sit === 'quiet') { const c = P0.habits.quiet = P0.habits.quiet || { n: 0, b: 0 }; c.n++; if (x.bluff) c.b++; }
    });
    if (!masked && !T.lesson) {
      const Y = S.you = S.you || { tonight: {}, prior: {}, fired: [] };
      Y.tonight = Y.tonight || {};
      R.bids.forEach(x => { if (x.who === 0 && x.shape) tallyAdd(Y.tonight, x.shape, x.bluff, 1); });
    }
    if (R.reads && R.reads.length) readout.reads = R.reads.map(r => readLine(T, r, kind === 'liar' && caller === r.who && b.q === r.q && b.f === r.f ? !good : null));
    R.bids.forEach(x => { T.seen[x.who].n++; if (x.bluff) T.seen[x.who].b++; });
    ev.push(readout);
    const barks = barksFor(S, T, { kind, caller, bidder, good, exact, winner, loser }, ev.slice(start));
    ev.push(...barks);
    T.last = { reveal: clone(reveal), readout: clone(readout), lines: clone(barks) };
    T.round = null;
    const me = T.seats[0];
    if (me.out) return tableEnd(S, T, me.place, ev);
    if (alive(T).length === 1) return tableEnd(S, T, 1, ev);
    T.wait = 'next';
  }

  // A read said out loud at the reveal. caught: the call it decided found your bid short (null: not that call).
  function readLine(T, r, caught) {
    const per = P[T.seats[r.who].id], she = per.pronouns === 'she' ? 'she' : per.pronouns === 'he' ? 'he' : 'they';
    const tell = tellText(r.shape, r.dir), right = r.kind === 'call' ? caught === true : !r.bluff;
    const text = r.kind === 'call'
      ? (right ? `${per.first} had you read: ${tell}.` : `${per.first} thought ${she} had you read (${tell}) and called. Not this time.`)
      : (right ? `${per.first} let your bid stand: ${tell}.` : `${per.first} had you read and let your bid stand: ${tell}. This time you had nothing.`);
    return { who: r.who, id: per.id, name: per.name, shape: r.shape, dir: r.dir, kind: r.kind, right, text };
  }

  function tableEnd(S, T, place, ev) {
    let payout = 0, refund = 0;
    const won = place === 1;
    if (won) {
      payout = T.pot;
      if (has(S, 'housemoney')) { const extra = Math.round(T.pot * 0.25); payout += extra; ev.push({ t: 'trick', id: 'housemoney', extra }); }
      if (T.onTab) payout -= T.buyIn;
      pay(S, ev, payout, 'pot');
    } else if (place === 2 && T.seats.length === 4 && !T.onTab) { refund = T.buyIn; pay(S, ev, refund, 'refund'); }
    // Grudges (a night that carries them): the one brought to this table is settled (you finished ahead of them: a
    // little extra) or over (they finished ahead of you); and the ones you made here, every regular you knocked out, or
    // everyone at a table you won.
    let G = null;
    if (S.grudges && T.kind !== 'last' && !T.lesson) {
      G = { marks: [] };
      if (T.grudge) {
        const hs = T.seats[T.grudge.seat], me = T.seats[0];
        const ahead = won || (hs.out && (!me.out || hs.place > me.place));
        G.met = T.grudge.id; G.settled = ahead ? 'won' : 'lost'; G.bonus = 0;
        if (ahead) G.bonus = pay(S, ev, Math.round(T.buyIn * GRUDGE_BONUS), 'grudge');
      }
      (won ? T.seats.slice(1).map(s => s.id) : T.ko || []).forEach(id => { if (id !== G.met && !G.marks.includes(id)) G.marks.push(id); });
    }
    const people = T.seats.slice(1).map(s => s.id);
    // Everything this table did to your cash: buy-in, antes, bonuses, pot, refund.
    // (A night saved before tables kept cash0 falls back to buy-in, pot and refund alone.)
    const net = T.cash0 != null ? S.cash - T.cash0 : payout + refund - (T.onTab ? 0 : T.buyIn);
    S.log.push({ hour: T.hour, kind: T.kind, rule: T.rule, people, place, won, payout, refund, net, buyIn: T.buyIn, onTab: T.onTab, rounds: T.rec.rounds, caught: T.rec.caught, caughtBy: T.rec.caughtBy, spots: T.rec.spots, cash: S.cash });
    const te = { t: 'tableEnd', hour: T.hour, kind: T.kind, place, won, payout, refund, net, rounds: T.rec.rounds, people, cash: S.cash };
    if (G) { te.grudge = G; S.log[S.log.length - 1].grudge = clone(G); }
    ev.push(te);
    S.table = null;
    if (T.kind === 'last') return endNight(S, won ? 'house' : 'cleaned', ev);
    openShop(S, ev);
  }

  function endNight(S, ending, ev) {
    S.phase = 'over'; S.ending = ending; S.table = null; S.shop = null;
    ev.push({ t: 'nightEnd', ending, cash: S.cash, share: shareLine(S) });
  }

  // ----- the back room -----
  function price(S, id, hour) {
    const raw = PRICE[TRICK[id].rarity] * PRICE_HOUR[clamp(hour, 0, 3)] * (has(S, 'friends') ? 0.75 : 1) * (inRoom(S, 'shop') ? SHOP_X : 1);
    return Math.max(5, Math.round(raw / 5) * 5);
  }
  // Curtis's offers: three, four with Friends Rates (never a trick you hold, rarer ones less often); one fewer After Hours.
  function drawOffers(S) {
    let pool = TRICKS.filter(t => !holds(S, t.id)).map(t => t.id);
    const out = [], want = (holds(S, 'friends') ? FRIENDS_OFFERS : OFFERS) - (inRoom(S, 'shop') ? 1 : 0);
    while (out.length < want && pool.length) {
      const tot = sum(pool.map(id => WEIGHT[TRICK[id].rarity]));
      let x = rnd(S) * tot, k = 0;
      for (; k < pool.length - 1; k++) { x -= WEIGHT[TRICK[pool[k]].rarity]; if (x < 0) break; }
      out.push(pool[k]); pool = pool.filter((id, j) => j !== k);
    }
    return out;
  }
  function openShop(S, ev) {
    S.phase = 'shop';
    S.rng = hash(S.seed + '|shop|' + S.hour, 5);
    S.shop = { hour: S.hour, offers: drawOffers(S), rerolls: 0 };
    const v = shopView(S);
    ev.push({ t: 'shop', hour: S.hour, offers: v.offers, rerollPrice: v.rerollPrice });
  }
  // The tricks you hold that share a build with id.
  const goesWith = (S, id) => partnersOf(id).filter(x => holds(S, x));
  function shopView(S) {
    if (S.phase !== 'shop' || !S.shop) return null;
    const h = S.shop.hour;
    return {
      hour: h, cash: S.cash, slots: SLOTS, rerollPrice: 10 * (S.shop.rerolls + 1),
      offers: S.shop.offers.map((id, i) => id ? Object.assign({ i, price: price(S, id, h), affordable: S.cash >= price(S, id, h) && S.tricks.length < SLOTS }, clone(TRICK[id]), { goesWith: goesWith(S, id) }) : null),
      held: S.tricks.map(t => Object.assign({ sell: Math.floor(t.paid / 2) }, clone(TRICK[t.id]), { goesWith: goesWith(S, t.id) }))
    };
  }
  function leaveShop(S, ev) {
    S.shop = null;
    S.hour++;
    if (S.hour === 4) {
      if (S.cash < doorOf(S)) return endNight(S, 'walked', ev);
    } else {
      const cheapest = Math.min(...S.offers[S.hour].filter(o => !closedAt(S, S.hour, o.kind)).map(o => o.buyIn));
      if (S.cash < cheapest && !has(S, 'tab')) return endNight(S, 'bust', ev);
    }
    S.phase = 'choose';
    ev.push({ t: 'hour', hour: S.hour, hourName: HOURS[S.hour].name, options: options(S) });
  }

  // ----- driving -----
  function run(S, ev) {
    for (let guard = 0; guard < 2000 && S.phase === 'table'; guard++) {
      const T = S.table;
      if (T.wait) break;
      if (!T.round) { startRound(S, T, ev); continue; }
      if (T.round.turn === 0) { T.wait = 'turn'; break; }
      const s = T.round.turn, m = scripted(S, T, s) || readMove(S, T, s);
      if (m.t === 'bid') placeBid(S, T, s, m.q, m.f, ev, m.habit);
      else if (sideBetOn(S, T, s)) { callOut(S, T, s, m.t, ev); T.round.call = { caller: s, kind: m.t }; T.wait = 'side'; }
      else challenge(S, T, s, m.t, ev);
    }
    ev.push({ t: 'wait', need: need(S) });
    return ev;
  }
  function need(S) { return S.phase === 'table' ? S.table.wait : S.phase; }
  // A person's move, and whether a read of you changed it: the same decision is taken without the read on the same
  // draws (the generator is put back), and if one calls Liar and the other does not, the read decided it. The
  // reveal says so, once per shape a table; the night counts every one.
  function readMove(S, T, s) {
    const R = T.round, b = lastBid(T), rd = readOf(S, T, s, b);
    if (!rd) return botMove(S, T, s);
    const rng = S.rng, m0 = botMove(S, T, s, true);
    S.rng = rng;
    const m = botMove(S, T, s);
    // (Only a change the read's way counts: a call from a read that says bluff, a bid let stand from one that says honest.)
    if ((m.t === 'liar') !== (m0.t === 'liar') && (m.t === 'liar') === (rd.dir === 'bluff')) {
      const Y = S.you = S.you || { tonight: {}, prior: {}, fired: [] };
      Y.fired = Y.fired || [];
      Y.fired.push({ id: T.seats[s].id, shape: rd.shape, dir: rd.dir, hour: T.hour });
      T.said = T.said || {};
      if (!T.said[rd.shape]) { T.said[rd.shape] = true; (R.reads = R.reads || []).push({ who: s, shape: rd.shape, dir: rd.dir, kind: m.t === 'liar' ? 'call' : 'stand', q: b.q, f: b.f, bluff: b.bluff }); }
    }
    return m;
  }
  // The practice hand's next set move, when it is this seat's and still legal; else null (the bot plays).
  function scripted(S, T, s) {
    const R = T.round, m = R.moves && R.moves[0];
    if (!m || m.who !== s) return null;
    R.moves.shift();
    if (m.t === 'bid' && (m.q > totalDice(T) || !facesOf(T).includes(m.f) || !higher(m.q, m.f, lastBid(T)))) { R.moves = []; return null; }
    if (m.t !== 'bid' && !lastBid(T)) { R.moves = []; return null; }
    return m;
  }

  // ----- the practice hand -----
  // You, Glenda on your left and Gerald, three dice each. Round 1, every cup open: Glenda's four 3s is
  // true (five, with the 1s) and honest by her own cup; Gerald's six 3s is not, and he holds none. Round 2 (Gerald lost, so he opens; he has two dice):
  // his two 5s is a sure thing by your 5, 5, 1; you raise to four, Glenda says five, and Gerald's seven 5s
  // is a bluff, with his tell showing (the Count puts it at 5%).
  const LESSON = {
    people: ['npc_glenda', 'npc_gerald'], dice: 3,
    rounds: [
      { open: true, opener: 1, dice: [[3, 3, 1], [3, 1, 6], [2, 5, 4]], moves: [{ who: 1, t: 'bid', q: 4, f: 3, habit: null }, { who: 2, t: 'bid', q: 6, f: 3, habit: null }] },
      { open: false, dice: [[5, 5, 1], [2, 5, 6], [3, 6]], moves: [{ who: 2, t: 'bid', q: 2, f: 5, habit: null }, { who: 1, t: 'bid', q: 5, f: 5, habit: null }, { who: 2, t: 'bid', q: 7, f: 5, habit: 'tell' }] }
    ]
  };
  function lesson() {
    const S = newNight({ seed: 'lesson' });
    S.night = 'lesson'; S.lesson = true;
    const people = LESSON.people.slice(), n = LESSON.dice;
    const rounds = clone(LESSON.rounds);
    rounds.forEach(r => r.moves.forEach(m => { if (m.habit === 'tell') m.habit = P[people[m.who - 1]].tell; }));
    const T = {
      hour: 0, kind: 'easy', rule: null, buyIn: 0, ante: 0, pot: 0, onTab: false,
      start: [n].concat(people.map(() => n)),
      seats: [{ id: 'me', n, dice: [], out: false, lost: 0 }].concat(people.map(id => ({ id, n, dice: [], out: false, lost: 0 }))),
      seen: [{ n: 0, b: 0 }].concat(people.map(() => ({ n: 0, b: 0 }))),
      round: null, roundNo: 0, wait: null, nextOpener: rounds[0].opener, used: {}, hot: false, last: null, cash0: S.cash,
      rec: { caught: [], caughtBy: [], spots: 0, rounds: 0 }, lesson: rounds
    };
    S.rng = hash('lesson|table', 3);
    S.table = T; S.phase = 'table';

  // =====================================================================
  // Persistence: settings, the night in progress, the Book, the ledger
  // =====================================================================
  const Settings = {
    v: 1, speed: 1, sound: true, theme: null, tipsDone: false, tipsSeen: [], talk: true, model: DEFAULT_MODEL, played: false, lesson: null,
    load() {
      const s = readJson(KEYS.settings);
      if (!s || s.v !== 1) return;
      if (s.speed === 1 || s.speed === 0.45) this.speed = s.speed;
      this.sound = s.sound !== false;
      if (s.theme === 'dark' || s.theme === 'parchment') this.theme = s.theme;
      this.tipsDone = s.tipsDone === true;
      this.tipsSeen = Array.isArray(s.tipsSeen) ? s.tipsSeen.filter(x => typeof x === 'string').slice(0, 20) : [];
      this.talk = s.talk !== false;
      if (MODELS.includes(s.model)) this.model = s.model;
      this.played = s.played === true;
      this.lesson = s.lesson === 'done' || s.lesson === 'skipped' ? s.lesson : null;
    },
    save() { store.set(KEYS.settings, JSON.stringify({ v: 1, speed: this.speed, sound: this.sound, theme: this.theme, tipsDone: this.tipsDone, tipsSeen: this.tipsSeen, talk: this.talk, model: this.model, played: this.played, lesson: this.lesson })); }
  };
  // The theme: Bones' own choice if one was made here, else the town's (novatria.settings.theme), else dark.
  function sharedTheme() { const s = readJson('novatria.settings'); return s && (s.theme === 'dark' || s.theme === 'parchment') ? s.theme : 'dark'; }
  const currentTheme = () => Settings.theme || sharedTheme();
  function applyTheme() { document.documentElement.setAttribute('data-theme', currentTheme()); const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', currentTheme() === 'parchment' ? '#e5d9bc' : '#141110'); }

  /* The night in progress: the engine's state after every action (so a reload resumes mid-round),
     plus what the end screen needs to say what the night added. */
  const Night = {
    load() {
      const n = readJson(KEYS.night);
      if (!n || n.v !== Engine.VERSION || !isObj(n.S) || n.S.v !== Engine.VERSION || n.S.phase === 'over') { if (n) store.del(KEYS.night); return null; }
      try { Engine.view(n.S); Engine.legal(n.S); } catch (e) { store.del(KEYS.night); return null; }
      return n;
    },
    save(rec) { store.set(KEYS.night, JSON.stringify(rec)); },
    clear() { store.del(KEYS.night); }
  };

  const Book = {
    data: null,
    load() {
      const b = readJson(KEYS.book);
      this.data = b && b.v === Engine.VERSION && isObj(b.book) && isObj(b.book.people) ? b.book : null;
      if (b && !this.data) store.del(KEYS.book);
      return this.data;
    },
    save() { if (this.data) store.set(KEYS.book, JSON.stringify({ v: Engine.VERSION, book: this.data })); },
    apply(events) { this.data = Engine.bookApply(this.data, events); this.save(); },
    met(id) { return !!(this.data && this.data.people && this.data.people[id]); },
    metIds() { return this.data && this.data.people ? Object.keys(this.data.people).filter(id => PEOPLE[id]) : []; }
  };

  const RANKS = [[0, 'Mark'], [200, 'Regular'], [600, 'Hustler'], [1500, 'Shark'], [4000, 'Legend of the Low Water']];
  /* After the house (all of it earned, none of it shown before): the feats, each of which opens a way to walk in.
     progress(): { n, of } where a feat counts toward a number; done(S, rec): the night just ended did it. */
  const FEATS = [
    { id: 'clean', start: 'pocket', name: 'Beat the house without buying a trick', done: (S) => S.ending === 'house' && !S.stats.bought.length },
    { id: 'quiet', start: 'blind', name: 'Win Last Call after Loretta goes quiet', done: (S, r) => S.ending === 'house' && !!(r && r.quiet) },
    { id: 'pages', start: 'marked', name: 'Fill 25 pages of the Book', of: 25, count: () => Book.metIds().length },
    { id: 'settle', start: 'tab', name: 'Settle three grudges', of: 3, count: () => Engine.grudges(Book.data).settled }
  ];
  const START_BY = {}; Engine.STARTS.forEach(s => { START_BY[s.id] = s; });
  // The home screen's picks for a new night: the room (default: the highest open) and the way in (default: the usual).
  const Pick = {
    r: null, s: null,
    room() { const open = Ledger.open(); return this.r === null || this.r > open ? open : this.r; },
    start() { return this.s && Ledger.starts().some(x => x.id === this.s) ? this.s : 'usual'; }
  };
  const Ledger = {
    data: null,
    // rung: the best After Hours rung beaten (0: none); feats: { id: the night it was done }.
    blank() { return { v: 1, nights: 0, best: 0, bestEnding: null, house: 0, streak: 0, bestStreak: 0, busts: 0, total: 0, daily: {}, rung: 0, feats: {} }; },
    // After Hours is open once the house has been beaten (on any night on record): the rungs up to one past the best beaten.
    open() { const L = this.data; return L && L.house > 0 ? Math.min(Engine.RUNGS, (L.rung | 0) + 1) : 0; },
    // The feats count once the house has been beaten; a counted one is marked done as soon as it is reached.
    feats() {
      const L = this.data;
      if (!L || !(L.house > 0)) return [];
      return FEATS.map(f => {
        const n = f.count ? Math.min(f.of, f.count()) : null;
        if (f.count && n >= f.of && !L.feats[f.id]) { L.feats[f.id] = L.nights; this.save(); }
        return { id: f.id, name: f.name, start: START_BY[f.start], done: !!L.feats[f.id], n, of: f.of || null };
      });
    },
    // The ways to walk in that are open: the usual, and one for each feat done.
    starts() { const done = this.feats().filter(f => f.done).map(f => f.start.id); return Engine.STARTS.filter(s => s.id === 'usual' || done.includes(s.id)); },
    load() {
      const l = readJson(KEYS.ledger);
      this.data = l && l.v === 1 && isObj(l.daily) ? Object.assign(this.blank(), l) : this.blank();
      // (A ledger kept before After Hours has neither: none beaten, no feats; a beaten house opens the first rung.)
      this.data.rung = clamp(this.data.rung | 0, 0, Engine.RUNGS);
      if (!isObj(this.data.feats)) this.data.feats = {};
      return this.data;
    },
    save() { store.set(KEYS.ledger, JSON.stringify(this.data)); },
    rank(best) { let r = 0; for (let i = 0; i < RANKS.length; i++) if (best >= RANKS[i][0]) r = i; return { i: r, name: RANKS[r][1], next: RANKS[r + 1] || null }; },
    /* A night just ended: the record, and what it added. r: the night's record in progress (rec: Loretta gone quiet). */
    record(S, r) {
      const L = this.data, before = this.rank(L.best), openBefore = this.open(), startsBefore = this.starts().map(s => s.id);
      const newBest = S.cash > L.best || L.nights === 0;
      L.nights++; L.total += S.cash;
      if (S.cash > L.best) { L.best = S.cash; L.bestEnding = S.ending; }
      if (S.ending === 'house') L.house++;
      if (S.ending === 'bust') { L.busts++; L.streak = 0; } else { L.streak++; L.bestStreak = Math.max(L.bestStreak, L.streak); }
      let daily = null;
      if (S.daily && !L.daily[S.daily]) { daily = L.daily[S.daily] = { cash: S.cash, ending: S.ending, share: Engine.shareLine(S) }; }
      // After Hours: a rung beaten is on record (the best of them); a feat done tonight is kept.
      const room = S.room | 0, rungBeaten = S.ending === 'house' && room > 0 ? room : 0, firstRung = rungBeaten > (L.rung | 0);
      if (firstRung) L.rung = rungBeaten;
      const feats = [];
      if (L.house > 0) FEATS.forEach(f => { if (!L.feats[f.id] && f.done && f.done(S, r)) { L.feats[f.id] = L.nights; feats.push(f.id); } });
      this.save();
      const opened = this.open() > openBefore ? this.open() : 0;
      const counted = this.feats().filter(f => f.done && !startsBefore.includes(f.start.id) && !feats.includes(f.id)).map(f => f.id);
      const newStarts = this.starts().filter(s => !startsBefore.includes(s.id)).map(s => s.id);
      return { newBest: newBest && S.cash > 0, rankBefore: before, rankAfter: this.rank(L.best), daily, rungBeaten, firstRung, opened, feats: feats.concat(counted), newStarts };
    }
  };

  // =====================================================================
  // Claude: Pearl's column and table talk. Optional colour; play never waits.
  // =====================================================================
  const Claude = {
    typed: '',
    keyInfo() {
      if (this.typed) return { key: this.typed, from: 'typed' };
      const t = session.get(TOWN_KEY); if (t) return { key: t, from: 'tab' };
      const d = store.get(TOWN_KEY); return d ? { key: d, from: 'device' } : { key: '', from: '' };
    },
    key() { return this.keyInfo().key; },
    setKey(k, remember) { this.typed = k; session.set(TOWN_KEY, k); if (remember) store.set(TOWN_KEY, k); },
    calls: 0,
    /* One call. Returns the parsed JSON, or throws { type }: 'no_key', 'auth', 'refusal', 'bad_json', 'http', 'network'.
       No sampling parameters, no tools, no prefill: the reply's shape comes from output_config.format. */
    async call(system, user, schema, maxTokens) {
      const key = this.key();
      if (!key) throw Object.assign(new Error('no API key'), { type: 'no_key' });
      const body = {
        model: Settings.model, max_tokens: maxTokens || 800,
        system: [{ type: 'text', text: system }],
        messages: [{ role: 'user', content: [{ type: 'text', text: user }] }],
        output_config: { effort: 'low', format: { type: 'json_schema', schema } }
      };
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 90000);
      this.calls++;
      let res;
      try {
        res = await fetch(ENDPOINT, { method: 'POST', signal: ctl.signal, body: JSON.stringify(body),
          headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': API_VERSION, 'anthropic-dangerous-direct-browser-access': 'true' } });
      } catch (e) { throw Object.assign(new Error('could not reach the API'), { type: 'network' }); } finally { clearTimeout(timer); }
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      if (!res.ok) throw Object.assign(new Error((data && data.error && data.error.message) || `HTTP ${res.status}`), { type: res.status === 401 || res.status === 403 ? 'auth' : 'http', status: res.status });
      if (!isObj(data) || data.stop_reason === 'refusal') throw Object.assign(new Error('the model declined'), { type: 'refusal' });
      const text = (Array.isArray(data.content) ? data.content : []).filter(b => isObj(b) && b.type === 'text').map(b => b.text).join('');
      try { const out = JSON.parse(text); if (!isObj(out)) throw new Error('not an object'); return out; } catch (e) { throw Object.assign(new Error('the reply was not the JSON asked for'), { type: 'bad_json' }); }
    },
    COLUMN_SYSTEM: ['You are Pearl Gentry, seventy-nine, columnist for the county weekly in Lockett\'s Ferry. You talk in newspaper headlines and write the way you talk.',
      'Write up one night of liar\'s dice at the Low Water, the bar by the river, as a short column: about 100 words, plain, dry and specific, in a headlines-and-facts newspaper voice. The player is "the visitor".',
      'Use only the facts given: no invented people, sums, tables or events. Name people as they are named in the facts. No stage directions, no markdown.',
      'Reply as JSON: "headline" is the headline (under ten words), "body" the column itself.'].join('\n'),
    COLUMN_SCHEMA: { type: 'object', additionalProperties: false, required: ['headline', 'body'], properties: { headline: { type: 'string' }, body: { type: 'string' } } },
    TALK_SYSTEM: ['You write table talk for a game of liar\'s dice at the Low Water, a bar in a small river town. The cups have just been lifted.',
      'Write one or two lines said out loud, each by a different person from the table, in that person\'s own voice as described, about what just happened. At most 14 words a line.',
      'Use only the facts given. Never the visitor (the player). No stage directions, no quotation marks, no markdown.',
      'Reply as JSON: "lines" is a list of at most two { "id": the person\'s id as given, "say": what they say }.'].join('\n'),
    TALK_SCHEMA: { type: 'object', additionalProperties: false, required: ['lines'], properties: { lines: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['id', 'say'], properties: { id: { type: 'string' }, say: { type: 'string' } } } } } }
  };

  // =====================================================================
  // The table screen: its parts
  // =====================================================================
  /* TV: what the table screen is drawing (the UI's own copy, advanced event by event while a batch plays;
     Table.sync puts it back in line with Engine.view after every batch). */
  const TV = { key: '', seats: [], start: [], total: 0, bid: null, my: [], blind: false, fixed: [], loaded: [], wild: true, faces: [2, 3, 4, 5, 6],
    rule: null, hour: 0, kind: 'easy', ante: 0, other: null, open: [], peek: [], ones: null, nod: null, revealSeq: 0, lastLoss: [], counts: [] };
  const seatOf = k => TV.seats[k] || null;

  const Cash = {
    value: 0, raf: 0,
    set(v, opts) {
      const node = $('cash');
      const from = this.value; this.value = v;
      cancelAnimationFrame(this.raf);
      if (!node) return Promise.resolve();
      if (!(opts && opts.animate) || instant() || from === v) { node.textContent = money(v); delete node.dataset.flash; return Promise.resolve(); }
      node.dataset.flash = v > from ? 'good' : 'danger';
      anim(node, [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], 380, { move: true });
      const dur = 600 * Speed.k, t0 = performance.now();
      return new Promise(res => {
        const step = now => {
          const k = Skip.on || Stage.aborting ? 1 : Math.min(1, (now - t0) / dur);
          const e = 1 - Math.pow(1 - k, 3);
          node.textContent = money(from + (v - from) * e);
          if (k < 1) this.raf = requestAnimationFrame(step);
          else { node.textContent = money(v); setTimeout(() => { delete node.dataset.flash; }, 500 * Speed.k); res(); }
        };
        this.raf = requestAnimationFrame(step);
      });
    }
  };
  const Streak = {
    n: 0,
    set(n, pop) {
      const node = $('streak'); if (!node) return;
      const up = n > this.n; this.n = n;
      node.textContent = `×${n}`;
      node.hidden = n < 1;
      node.toggleAttribute('data-hot', n >= 2);
      node.title = n ? `${n} challenge${n > 1 ? 's' : ''} won in a row: the next win pays ${Math.min(n, 3)} more ante${Math.min(n, 3) > 1 ? 's' : ''}` : '';
      node.setAttribute('aria-label', node.title || 'no streak');
      if (pop && up) anim(node, [{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], 320, { move: true });
    }
  };

  // ----- One opponent's seat (a button: tap for their page in your Book) -----
  class Seat {
    constructor(k, id, n, max) {
      this.k = k; this.id = id; this.p = PEOPLE[id]; this.n = n; this.max = max; this.mood = 'even'; this.out = false;
      this.faceBox = el('span', { class: 'seat-face' }, faceNode(this.p, 'even'));
      this.tray = el('span', { class: 'tray' });
      this.bubble = el('span', { class: 'bubble', 'data-empty': '' });
      this.habitEl = el('span', { class: 'habit' });
      this.tag = el('span', { class: 'seat-tag' });
      this.ledgerEl = el('span', { class: 'seat-ledger', hidden: true });
      this.root = el('button', { class: 'seat', type: 'button', dataset: { seat: String(k), id }, onclick: () => People.open(id) },
        this.tag, this.faceBox, el('span', { class: 'seat-name' }, this.p.first), this.ledgerEl, this.tray, this.bubble, this.habitEl);
      this.shown = [];
      this.renderTray();
    }
    label() { this.root.setAttribute('aria-label', `${this.p.name}: ${this.out ? 'out' : plural(this.n, 'die', 'dice')}.${this.grudge ? ' ' + this.grudge : ''} Open ${pron(this.id)[2]} page in your Book.`); this.root.dataset.dice = String(this.out ? 0 : this.n); }
    /* shown: [{i, face, why}] face-up dice (Open hand, Mirror Ring, Cornered). */
    renderTray(shown) {
      if (shown) this.shown = shown;
      const kids = [];
      for (let i = 0; i < this.max; i++) {
        const s = this.shown.find(x => x.i === i);
        kids.push(i < this.n ? (s ? Dice.node(s.face, { peek: true, label: false }) : Dice.node(0, { down: true, label: false })) : Dice.node(0, { empty: true, label: false }));
      }
      this.tray.toggleAttribute('data-six', this.max > 5);
      this.tray.style.setProperty('--k', String(this.max));
      this.tray.removeAttribute('data-open');
      this.tray.replaceChildren(...kids);
      this.label();
    }
    /* The practice hand's open cup: every die face up, nothing lit. */
    renderUp(dice) {
      const kids = [];
      for (let i = 0; i < this.max; i++) kids.push(i < this.n && i < dice.length ? Dice.node(dice[i], { label: false }) : i < this.n ? Dice.node(0, { down: true, label: false }) : Dice.node(0, { empty: true, label: false }));
      this.tray.setAttribute('data-open', '');
      this.tray.replaceChildren(...kids);
      this.label();
    }
    /* The cup lifted: these dice, the matches lit (hits: indexes), the rest dimmed. */
    renderOpen(dice, hits) {
      const kids = [];
      for (let i = 0; i < this.max; i++) kids.push(i < this.n && i < dice.length ? Dice.node(dice[i], { label: false, hit: hits.includes(i), dim: !hits.includes(i) }) : i < this.n ? Dice.node(0, { down: true, label: false }) : Dice.node(0, { empty: true, label: false }));
      this.tray.replaceChildren(...kids);
      this.label();
    }
    setCount(n) { this.n = n; }
    setLedger(text) { this.ledgerEl.hidden = !text; this.ledgerEl.textContent = text || ''; }
    setMood(m) {
      if (m === this.mood) return;
      this.mood = m;
      this.faceBox.replaceChildren(faceNode(this.p, m));
      anim(this.faceBox, [{ transform: 'scale(.86)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], 300, { move: true });
    }
    setTurn(on) { this.root.toggleAttribute('data-turn', !!on); }
    setOut(on) { this.out = !!on; this.root.toggleAttribute('data-out', !!on); this.tag.textContent = on ? 'OUT' : this.grudge ? 'GRUDGE' : ''; if (on) { this.mood = ''; this.setMood('asleep'); } this.label(); }
    /* Back for their money: the seat's tag says so (and its label). */
    setGrudge(line) { this.grudge = line || null; this.root.toggleAttribute('data-grudge', !!line); if (!this.out) this.tag.textContent = line ? 'GRUDGE' : ''; this.tag.title = line || ''; this.label(); }
    clearTalk() { this.bubble.setAttribute('data-empty', ''); this.bubble.replaceChildren(); delete this.bubble.dataset.kind; delete this.bubble.dataset.by; this.bubble.removeAttribute('aria-label'); this.setHabit(''); }
    /* The habit line under the face (kept whole in its title: on a short screen it keeps to one line). */
    setHabit(text, under) { this.habitEl.textContent = text || ''; if (text) this.habitEl.title = text; else this.habitEl.removeAttribute('title'); this.habitEl.toggleAttribute('data-under', !!(text && under)); Fit.soon(); }
    thinking() { this.bubble.removeAttribute('data-empty'); delete this.bubble.dataset.kind; delete this.bubble.dataset.by; this.bubble.replaceChildren(el('span', { class: 'dots', 'aria-label': 'thinking' }, el('i'), el('i'), el('i'))); }
    async habit(h) {
      this.setHabit(h ? h.text : '', h && h.underline);
      if (h) await anim(this.habitEl, [{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }], 300, { move: true });
    }
    showBid(q, f) {
      this.bubble.removeAttribute('data-empty'); delete this.bubble.dataset.kind; delete this.bubble.dataset.by;
      this.bubble.replaceChildren(el('span', null, word(q)), Dice.node(f, { label: false }));
      this.bubble.setAttribute('aria-label', bidText(q, f));
    }
    async sayBid(q, f) {
      this.showBid(q, f);
      await anim(this.bubble, [{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.12)', opacity: 1, offset: .6 }, { transform: 'scale(1)' }], 260, { move: true, easing: 'ease-out' });
    }
    async sayCall(kind) {
      this.bubble.removeAttribute('data-empty'); this.bubble.dataset.kind = kind; delete this.bubble.dataset.by;
      this.bubble.replaceChildren(kind === 'liar' ? 'Liar!' : 'Spot on!');
      await anim(this.bubble, [{ transform: 'scale(.4)' }, { transform: 'scale(1.2)', offset: .6 }, { transform: 'scale(1)' }], 240, { move: true });
    }
    /* A spoken line after a reveal (a scripted bark, or Claude's). */
    sayLine(text, by) {
      this.bubble.removeAttribute('data-empty'); this.bubble.dataset.kind = 'say';
      if (by) this.bubble.dataset.by = by; else delete this.bubble.dataset.by;
      this.bubble.replaceChildren(`“${text}”`);
      this.bubble.setAttribute('aria-label', `${this.p.first}: ${text}`);
      this.setHabit('');
      return anim(this.bubble, [{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }], 260, { move: true });
    }
    shakeCup() {
      return anim(this.tray, [{ transform: 'none' }, { transform: 'rotate(-5deg) translateY(-2px)' }, { transform: 'rotate(5deg)' }, { transform: 'rotate(-3deg) translateY(-1px)' }, { transform: 'rotate(2deg)' }, { transform: 'none' }], 380, { move: true, easing: 'ease-in-out' });
    }
    async lift(dice, quick) {
      await anim(this.tray, [{ transform: 'none' }, { transform: 'translateY(-6px) scale(1.05)', opacity: .2 }], quick ? 70 : 110, { move: true, easing: 'ease-in' });
      const nodes = dice.map(f => Dice.node(f, { label: false }));
      const kids = nodes.slice();
      for (let i = dice.length; i < this.max; i++) kids.push(Dice.node(0, { empty: true, label: false }));
      this.tray.replaceChildren(...kids);
      await anim(this.tray, [{ transform: 'translateY(4px)', opacity: .2 }, { transform: 'none', opacity: 1 }], quick ? 80 : 130, { move: true });
      return nodes;
    }
    async loseDice(count, left) {
      for (let k = 0; k < count && this.n > 0; k++) {
        const live = [...this.tray.children].filter(d => !d.hasAttribute('data-empty'));
        const d = live[live.length - 1];
        this.n--;
        if (d) {
          Dice.crack(d);
          await anim(d, [{ transform: 'none' }, { transform: 'rotate(-12deg) scale(1.15)', offset: .25 }, { transform: 'translateY(26px) rotate(70deg) scale(.6)', opacity: 0 }], 400, { move: true, easing: 'cubic-bezier(.5,0,.8,.6)', fade: [{ opacity: 1 }, { opacity: 0 }] });
          d.replaceWith(Dice.node(0, { empty: true, label: false }));
        }
      }
      this.n = left;
      this.label();
    }
    async gainDie(left) {
      const grew = left > this.n;
      this.n = left; this.shown = [];
      this.renderTray();
      if (grew) { const d = this.tray.children[this.n - 1]; await anim(d, [{ transform: 'scale(0)' }, { transform: 'scale(1.4)', offset: .6 }, { transform: 'scale(1)' }], 360, { move: true }); }
    }
  }

  // ----- The bid on the table (and the reveal counter in the same place) -----
  const BidBanner = {
    root: null, wordEl: null, line: null, num: null, of: null,
    build(root) {
      this.root = root;
      this.wordEl = el('div', { class: 'bid-word' });
      this.line = el('div', { class: 'bid-line' });
      this.num = el('div', { class: 'count-num' }, '0');
      this.of = el('div', { class: 'count-of' });
      root.replaceChildren(el('div', { class: 'bid-main' }, this.wordEl, this.line), el('div', { class: 'bid-count', 'aria-hidden': 'true' }, this.num, this.of));
    },
    quiet(text) { delete this.root.dataset.mode; this.wordEl.setAttribute('data-quiet', ''); this.wordEl.style.fontSize = ''; this.wordEl.textContent = text; this.line.replaceChildren(); this.root.setAttribute('aria-label', text); },
    /* bid: {q, f, who (seat), id} */
    async set(bid, punch) {
      delete this.root.dataset.mode;
      this.wordEl.removeAttribute('data-quiet');
      const w = word(bid.q);
      this.wordEl.textContent = w;
      this.wordEl.style.fontSize = w.length > 6 ? `min(1em, ${(13 / w.length).toFixed(2)}em)` : '';
      const dice = []; for (let i = 0; i < bid.q; i++) dice.push(Dice.node(bid.f, { label: false }));
      this.line.toggleAttribute('data-many', bid.q > 8);
      this.line.replaceChildren(...dice, el('span', { class: 'bid-by' }, '— ' + (bid.who === 0 ? 'you' : first(bid.id))));
      this.root.setAttribute('aria-label', `On the table: ${bidText(bid.q, bid.f)}, ${bid.who === 0 ? 'your bid' : 'bid by ' + first(bid.id)}`);
      if (punch) {
        anim(this.wordEl, [{ transform: 'scale(1.35)', opacity: .3 }, { transform: 'scale(.96)', opacity: 1, offset: .6 }, { transform: 'scale(1)' }], 280, { move: true });
        await Promise.all(dice.map((d, i) => anim(d, [{ transform: 'translateY(-10px) scale(.5)', opacity: 0 }, { transform: 'none', opacity: 1 }], 200, { move: true, delay: i * 22 })));
      }
    },
    counter(q, f) {
      this.num.textContent = '0'; delete this.num.dataset.state;
      this.of.replaceChildren(el('span', null, `of ${word(q)}`), Dice.node(f, { label: false }));
      this.root.dataset.mode = 'count';
    },
    tick(n, state) {
      this.num.textContent = String(n);
      if (state) this.num.dataset.state = state; else delete this.num.dataset.state;
      anim(this.num, [{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], 200, { move: true, easing: 'cubic-bezier(.3,1.6,.5,1)' });
    }
  };

  const bandColour = p => `color-mix(in srgb, var(--good) ${Math.round(Math.max(0, Math.min(1, (p - .15) / .7)) * 100)}%, var(--danger))`;
  const pct = p => (p > 0 && p < .005 ? '<1%' : p < 1 && p > .995 ? '>99%' : Math.round(p * 100) + '%');
  // ----- The Count bar -----
  const CountBar = {
    fill: null, lbl: null, root: null,
    build(root) { this.root = root; this.fill = el('span', { class: 'fill' }); this.lbl = el('span', { class: 'lbl' }); root.replaceChildren(el('span', { class: 'track' }, this.fill), this.lbl); },
    set(p, label) {
      if (p === null || p === undefined) { this.fill.style.width = '0'; this.lbl.replaceChildren(label || 'Nothing bid yet'); this.root.dataset.count = ''; return; }
      const n = Math.round(p * 100);
      this.fill.style.width = Math.max(2, n) + '%';
      this.fill.style.backgroundColor = bandColour(p);
      const b = el('b', null, pct(p)); b.style.color = bandColour(p);
      this.lbl.replaceChildren(label || 'The Count, by your dice: ', b);
      this.root.dataset.count = String(n);
    }
  };

  /* ----- The Book, in the moment: under the Count, what your Book has on the habit that came with the bid ----- */
  const BookLine = {
    root: null,
    build(root) { this.root = root; },
    clear() { this.root.replaceChildren(); this.root.removeAttribute('data-quiet'); },
    /* id: who bid; h: the habit shown with the bid ({i, text, underline, sit?}) or null; book: the Book as it stood;
       sit: the house's situation for the bid (Last Call). For Loretta and Curtis the tally quoted is the one for the
       situation in front of you ("when he raises: seen 4 times…"); Loretta gone quiet shows what the Book has on that. */
    set(id, h, book, sit) {
      if (!PEOPLE[id]) { this.clear(); return; }
      const kids = [ICON.book()];
      const tally = (n, b, st) => [' seen ', el('b', null, String(n)), n === 1 ? ' time: ' : ' times: ', el('b', { class: 'bl-bluff' }, `${b} bluff${b === 1 ? '' : 's'}`), ', ', el('b', { class: 'bl-straight' }, `${st} straight`)];
      if (!h && sit === 'quiet') {
        const g = Engine.bookPage(book, id).gear || { n: 0, bluff: 0, straight: 0 };
        this.root.toggleAttribute('data-quiet', !g.n);
        kids.push(el('span', null, el('em', null, `${PEOPLE[id].first} says nothing`), g.n ? [' · since she went quiet:'].concat(tally(g.n, g.bluff, g.straight)) : ' · your Book has nothing on her quiet yet'));
        this.root.replaceChildren(...kids);
        return;
      }
      if (!h) { this.clear(); return; }
      const t = Engine.habitTally(book, id, h);
      const name = el('em', null, `${PEOPLE[id].first} ${h.text}`);
      if (h.underline) name.style.textDecoration = 'underline';
      this.root.toggleAttribute('data-quiet', !t.n);
      if (t.sit) kids.push(el('span', { 'data-sit': t.sit }, name, ` · ${t.when}:`, ...(t.n ? tally(t.n, t.bluff, t.straight) : [` not seen before${t.all.n ? ` (${t.all.n}× all told)` : ''}`])));
      else if (!t.n) kids.push(el('span', null, name, ' · first time you’ve seen this'));
      else kids.push(el('span', null, name, ' ·', ...tally(t.n, t.bluff, t.straight)));
      this.root.replaceChildren(...kids);
    }
  };

  // ----- Your cup -----
  const MyCup = {
    root: null, row: null, capL: null, capR: null, nodes: [], state: { dice: [], max: 5, fixed: [], loaded: [], down: false },
    build(root) {
      this.root = root;
      this.row = el('div', { class: 'cupdice', 'aria-label': 'Your dice' });
      this.capL = el('span', null, 'Your cup'); this.capR = el('span', null, '1s are wild');
      root.replaceChildren(this.row, el('div', { class: 'cupcap' }, this.capL, this.capR));
    },
    opts(i) { const s = this.state; return { loaded: s.loaded.includes(i) ? 'loaded six: counts as two 6s' : s.fixed.includes(i) ? 'wild for your bids only' : false, twice: s.loaded.includes(i) && s.dice[i] === 6 }; },
    render() {
      const s = this.state;
      this.nodes = s.dice.map((f, i) => (s.down ? Dice.node(0, { down: true }) : Dice.node(f, this.opts(i))));
      const kids = this.nodes.slice();
      for (let i = s.dice.length; i < s.max; i++) kids.push(Dice.node(0, { empty: true }));
      this.row.toggleAttribute('data-six', s.max > 5);
      this.row.replaceChildren(...kids);
      this.root.dataset.dice = String(s.dice.length);
      this.root.dataset.faces = s.down ? '' : s.dice.join(',');
    },
    caption(text) { this.capR.textContent = text; },
    get el() { return this.root; },
    set(dice, max, o) { this.state = { dice: dice.slice(), max: max || this.state.max, fixed: (o && o.fixed) || [], loaded: (o && o.loaded) || [], down: !!(o && o.down) }; this.render(); this.root.style.transform = ''; this.root.style.opacity = ''; },
    /* The cup lifted at a reveal (hits lit, the rest dimmed; twice: the loaded six that counted as two). */
    setOpen(dice, max, hits, n, twice) {
      this.state = { dice: dice.slice(0, n), max, fixed: [], loaded: [], down: false };
      while (this.state.dice.length < n) this.state.dice.push(0); // a die won back: not rolled yet
      this.render();
      this.nodes.forEach((d, i) => { if (!this.state.dice[i]) { Dice.set(d, 0, { down: true }); return; } d.toggleAttribute('data-hit', hits.includes(i)); d.toggleAttribute('data-dim', !hits.includes(i)); d.toggleAttribute('data-twice', i === twice); });
      this.root.dataset.faces = '';
    },
    setTurn(on) { this.root.toggleAttribute('data-turn', !!on); this.capL.textContent = on ? 'Your turn' : 'Your cup'; this.capL.classList.toggle('turn', !!on); },
    mark(i, kind) { if (kind === 'loaded') this.state.loaded.push(i); else this.state.fixed.push(i); if (this.nodes[i]) Dice.set(this.nodes[i], this.state.dice[i], this.opts(i)); },
    async roll(dice, indices) {
      const all = !indices;
      this.state.dice = dice.slice(); this.state.down = false;
      if (all) this.render(); else indices.forEach(i => { if (this.nodes[i]) Dice.set(this.nodes[i], dice[i], this.opts(i)); });
      this.root.dataset.faces = dice.join(','); this.root.dataset.dice = String(dice.length);
      if (instant()) return;
      Sfx.play('rattle');
      const which = all ? this.nodes.map((d, i) => i) : indices;
      await Promise.all(which.map(async (i, j) => {
        const d = this.nodes[i]; if (!d) return;
        const dir = i % 2 ? 1 : -1;
        const spin = (200 + fxRand() * 220) * dir;
        const a = anim(d, [
          { transform: `translate(${-30 * dir}px,-46px) rotate(${-spin}deg) scale(.55)`, opacity: 0 },
          { transform: `translate(${5 * dir}px,3px) rotate(${14 * dir}deg) scale(1.05)`, opacity: 1, offset: .62 },
          { transform: `translate(${-2 * dir}px,0) rotate(${-5 * dir}deg)`, offset: .84 },
          { transform: 'none' }], 400, { move: true, delay: j * 40, easing: 'cubic-bezier(.2,.7,.3,1)' });
        if (!Motion.reduce) {
          try { await wait(j * 40); for (let k = 0; k < 4 && !instant(); k++) { Dice.set(d, 1 + Math.floor(fxRand() * 6), {}); await wait(60); } } catch (e) { /* aborted */ }
        }
        await a;
        Dice.set(d, this.state.dice[i], this.opts(i));
      }));
      Sfx.play('thump');
    },
    async setFace(i, face) {
      this.state.dice[i] = face;
      this.state.fixed = this.state.fixed.filter(x => x !== i); this.state.loaded = this.state.loaded.filter(x => x !== i);
      const d = this.nodes[i]; if (!d) return;
      await anim(d, [{ transform: 'none' }, { transform: 'rotateY(90deg)' }], 140, { move: true });
      Dice.set(d, face, this.opts(i));
      this.root.dataset.faces = this.state.dice.join(',');
      await anim(d, [{ transform: 'rotateY(90deg)' }, { transform: 'none' }], 160, { move: true });
    },
    async lose(n) {
      for (let k = 0; k < n && this.state.dice.length; k++) {
        const d = this.nodes[this.state.dice.length - 1];
        if (d) {
          Dice.crack(d);
          await anim(d, [{ transform: 'none' }, { transform: 'translateX(-4px) rotate(-6deg)', offset: .12 }, { transform: 'translateX(4px) rotate(6deg)', offset: .24 }, { transform: 'rotate(-10deg) scale(1.08)', offset: .4 }, { transform: 'translateY(70px) rotate(80deg) scale(.7)', opacity: 0 }], 520, { move: true, easing: 'cubic-bezier(.5,0,.8,.6)', fade: [{ opacity: 1 }, { opacity: 0 }] });
        }
        this.state.dice.pop(); this.render();
      }
    },
    async gain(face) {
      this.state.dice.push(face); this.render();
      const d = this.nodes[this.nodes.length - 1];
      await anim(d, [{ transform: 'scale(0) rotate(-90deg)' }, { transform: 'scale(1.3) rotate(8deg)', offset: .6 }, { transform: 'none' }], 420, { move: true });
    },
    async tip() {
      await anim(this.root, [{ transform: 'none' }, { transform: 'rotate(-6deg)', offset: .2 }, { transform: 'translate(60px,30px) rotate(80deg)', opacity: 0 }], 800, { move: true, easing: 'cubic-bezier(.5,0,.7,.4)', fade: [{ opacity: 1 }, { opacity: 0 }] });
      if (!instant()) this.root.style.opacity = '0';
    }
  };

  // ----- Round log (one line: the bids so far) -----
  const Log = {
    root: null, chain: [], last: '',
    build(root) { this.root = root; },
    render() {
      if (!this.chain.length) { this.root.replaceChildren(this.last ? el('span', null, this.last) : ''); return; }
      const tail = this.chain.slice(-3);
      const kids = [];
      if (this.chain.length > 3) kids.push('… ');
      tail.forEach((c, i) => { if (i) kids.push(' → '); kids.push(el('b', null, c.who + ':'), ' ' + c.what); });
      this.root.replaceChildren(...kids);
    },
    newRound() { this.chain = []; this.render(); },
    add(who, what) { this.chain.push({ who, what }); this.render(); },
    set(chain, last) { this.chain = chain; this.last = last || ''; this.render(); },
    result(text) { this.last = text; this.chain = []; this.render(); }
  };

  // ----- The bid picker: Liar / Spot on, a face, how many, Bid -----
  const Picker = {
    root: null, ctx: null, q: 1, f: 2, touched: false, faceBtns: [],
    build(root) {
      this.root = root;
      this.liar = el('button', { class: 'call liar', id: 'btn-liar', type: 'button', disabled: true, onclick: () => this.call('liar', false) }, 'Liar!');
      this.liar2Small = el('small', null, 'for two dice');
      this.liar2 = el('button', { class: 'call liar2', id: 'btn-liar2', type: 'button', disabled: true, hidden: true, title: 'Double or Nothing: right and the bidder loses 2 dice, wrong and you lose 1', onclick: () => this.call('liar', true) }, 'Liar ×2', this.liar2Small);
      this.spotSmall = el('small', null, '');
      this.spot = el('button', { class: 'call spot', id: 'btn-spot', type: 'button', disabled: true, onclick: () => this.call('spot', false) }, 'Spot on', this.spotSmall);
      this.calls = el('div', { class: 'calls' }, this.liar, this.liar2, this.spot);
      this.facesEl = el('div', { class: 'faces', role: 'group', 'aria-label': 'Face' });
      this.minus = el('button', { type: 'button', id: 'q-minus', 'aria-label': 'One fewer', disabled: true }, '−');
      this.plus = el('button', { type: 'button', id: 'q-plus', 'aria-label': 'One more', disabled: true }, '+');
      this.qty = el('span', { class: 'qty', id: 'q-val', 'aria-live': 'polite' }, '–');
      this.what = el('span', { class: 'what' }, ' ');
      this.pctEl = el('span', { class: 'pct' }, ' ');
      this.bidBtn = el('button', { class: 'btn primary bidbtn', id: 'btn-bid', type: 'button', disabled: true, onclick: () => this.bid() }, 'Bid');
      root.replaceChildren(this.calls, this.facesEl,
        el('div', { class: 'bidrow' }, el('div', { class: 'stepper', role: 'group', 'aria-label': 'How many' }, this.minus, this.qty, this.plus), el('div', { class: 'live' }, this.what, this.pctEl), this.bidBtn));
      this.holdRepeat(this.minus, -1); this.holdRepeat(this.plus, 1);
      this.setFaces([2, 3, 4, 5, 6]);
    },
    setFaces(faces) {
      if (this.faceBtns.length === faces.length && this.faceBtns.every((b, i) => Number(b.dataset.f) === faces[i])) return;
      this.faceBtns = faces.map(face => el('button', { class: 'facebtn', type: 'button', dataset: { f: String(face) }, disabled: true, 'aria-pressed': 'false', 'aria-label': `${face}s`, onclick: () => this.pickFace(face) }, Dice.node(face, { label: false, wild: false })));
      this.facesEl.style.setProperty('--nf', faces.length);
      this.facesEl.replaceChildren(...this.faceBtns);
    },
    min(face) { const b = this.ctx && this.ctx.bid; return !b ? 1 : (face > b.f ? b.q : b.q + 1); },
    // The most of a face you may bid: the dice on the table (one more for 6s with your loaded six).
    max(face) { const m = this.ctx && this.ctx.maxFor; return m && m[face] != null ? m[face] : this.ctx ? this.ctx.total : 0; },
    legal(q, f) { return !!this.ctx && Engine.isLegalBid(App.state, q, f); },
    step(d) {
      if (!this.ctx) return false;
      const nq = this.q + d;
      if (nq < this.min(this.f) || nq > this.max(this.f)) return false;
      this.q = nq; this.touched = true; this.render(); Sfx.play('clack'); return true;
    },
    holdRepeat(btn, d) {
      let t1 = 0, t2 = 0;
      const stop = () => { clearTimeout(t1); clearInterval(t2); };
      btn.addEventListener('pointerdown', e => {
        if (btn.disabled || e.button > 0) return;
        e.preventDefault(); this.step(d);
        t1 = setTimeout(() => { t2 = setInterval(() => { if (!this.step(d)) stop(); }, 85); }, 380);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
      btn.addEventListener('click', e => { if (e.detail === 0) this.step(d); });
      btn.addEventListener('contextmenu', e => e.preventDefault());
    },
    pickFace(face) {
      if (!this.ctx || this.min(face) > this.max(face)) return;
      this.f = face;
      if (!this.touched || !this.legal(this.q, face)) this.q = Math.max(this.min(face), this.touched ? this.q : this.min(face));
      if (!this.legal(this.q, face)) this.q = this.min(face);
      Sfx.play('clack');
      this.render();
    },
    render() {
      const c = this.ctx, on = !!c;
      this.root.toggleAttribute('data-calm', !on);
      // Double or Nothing: c.double = its calls for 2 left at this table; at none the button goes.
      const dl = on && c.double > 0 ? c.double : 0;
      this.liar.disabled = !on || !c.canLiar; this.liar2.disabled = !on || !c.canLiar || !dl;
      this.liar2.hidden = !dl; this.calls.toggleAttribute('data-three', !!dl);
      if (dl) { this.liar2Small.textContent = `for two · ${dl} left`; this.liar2.setAttribute('aria-label', `Liar ×2 · ${dl} left (for two dice)`); }
      this.spot.disabled = !on || !c.canSpot;
      const ex = on && c.bid ? Engine.countExact(App.state, c.bid.q, c.bid.f) : null;
      this.spotSmall.textContent = ex === null ? '' : `exactly: ${pct(ex)}`;
      this.faceBtns.forEach(b => {
        const face = Number(b.dataset.f);
        b.disabled = !on || this.min(face) > this.max(face);
        b.setAttribute('aria-pressed', String(on && face === this.f));
        b.toggleAttribute('data-illegal', on && this.q < this.min(face));
      });
      this.minus.disabled = !on || this.q - 1 < this.min(this.f);
      this.plus.disabled = !on || this.q + 1 > this.max(this.f);
      this.bidBtn.disabled = !on || !c.canBid || !this.legal(this.q, this.f);
      if (!on) { this.qty.textContent = ' '; this.what.textContent = ' '; this.pctEl.textContent = ' '; this.pctEl.style.color = ''; return; }
      this.qty.textContent = String(this.q);
      this.what.textContent = bidText(this.q, this.f);
      const p = Engine.count(App.state, this.q, this.f);
      if (p === null) { this.pctEl.textContent = ' '; return; }
      this.pctEl.replaceChildren(pct(p), el('span', { class: 'long' }, ' by your dice'));
      this.pctEl.style.color = bandColour(p);
      this.bidBtn.setAttribute('aria-label', `Bid ${bidText(this.q, this.f)} (${pct(p)} by your dice)`);
    },
    /* ctx: {bid, total, maxFor, faces, canBid, canLiar, canSpot, mustBid, double (Double or Nothing's calls left; 0: none), minBid} */
    open(c) {
      const same = this.ctx && JSON.stringify(c.bid) === JSON.stringify(this.ctx.bid) && c.total === this.ctx.total;
      this.ctx = c;
      this.setFaces(c.faces);
      if (!same) {
        this.touched = false;
        // Start on the most of your best face the Count puts at 60% or better, when that is a
        // legal raise; otherwise on the smallest legal raise.
        const best = Engine.suggest(App.state, 0.6) || c.minBid;
        if (best) { this.q = best.q; this.f = best.f; }
      }
      this.render();
      if (!same) anim(this.root, [{ transform: 'translateY(6px)' }, { transform: 'none' }], 200, { move: true });
    },
    close() { this.ctx = null; this.render(); },
    call(kind, dbl) { if (!this.ctx || (dbl && !(this.ctx.double > 0))) return; const a = kind === 'liar' ? (dbl ? { t: 'liar', double: true } : { t: 'liar' }) : { t: 'spot' }; this.close(); App.act(a); },
    bid() { if (!this.ctx || !this.legal(this.q, this.f)) return; const a = { t: 'bid', q: this.q, f: this.f }; this.close(); App.act(a); }
  };

  // ----- Stamp, toast, effects -----
  /* How long a line needs to be read: a beat to notice it, then about four words a second (never more than five
     seconds). It is a floor under a popup's own time, so a short one ("Sticky Fingers: +$6") is as quick as ever
     and a long one stays up. The Fast speed shortens it only a little: nobody reads twice as fast. */
  const readMs = text => {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean).length;
    const ms = Math.min(5000, 450 + 260 * words);
    return Speed.k > 0 ? ms * Math.max(Speed.k, .8) / Speed.k : ms;
  };
  const Stamp = {
    layer: null, cur: null,
    async show(text, kind, sub, hold) {
      this.clear();
      const rot = (fxRand() * 6 - 9).toFixed(1);

  // =====================================================================

  // =====================================================================
  /* Which of a cup's dice count for the bid (as the engine counts: your fixed 1s are plain on anyone else's bid). */
  function hitsOf(dice, f, wild, seat, bidder, fixed) {
    const out = [];
    dice.forEach((d, i) => { if (d === f || (wild && d === 1 && !(seat === 0 && bidder !== 0 && (fixed || []).includes(i)))) out.push(i); });
    return out;

  const Reveal = {
    async play(e) {

      const order = e.cups.filter(c => c.who !== 0).concat(e.cups.filter(c => c.who === 0));
      for (const cup of order) {
        let nodes;
        const hits = hitsOf(cup.dice, e.f, e.wild, cup.who, e.bidder, TV.fixed);
        // A cup with nothing for the bid lifts fast and the count moves on; the drama is in the hits.
        if (cup.who === 0) { nodes = MyCup.nodes; await anim(MyCup.el, [{ transform: 'none' }, { transform: 'translateY(-4px)' }, { transform: 'none' }], hits.length ? 180 : 120, { move: true }); }
        else { Sfx.play('thump'); const s = seatOf(cup.who); nodes = s ? await s.lift(cup.dice, !hits.length) : []; }
        if (hits.length) await wait(40);
        cup.dice.forEach((d, i) => { if (!hits.includes(i) && nodes[i]) nodes[i].setAttribute('data-dim', ''); });
        for (const i of hits) {

          BidBanner.tick(n, state());
          Sfx.play('tick', n); Haptic.tap(6);
          await wait(n === e.q - 1 ? 280 : 110);
          // Loaded Six: the same die again, worth a second 6.
          if (cup.who === 0 && i === e.loaded) {
            n++;
            node.setAttribute('data-twice', '');
            anim(node, [{ transform: 'scale(1)' }, { transform: 'scale(1.6) rotate(8deg)', offset: .4 }, { transform: 'scale(1)' }], 320, { move: true, easing: 'ease-out' });
            BidBanner.tick(n, state());
            say('Your loaded six counts as two 6s.');
            Sfx.play('tick', n); Haptic.tap(6);
            await wait(260);
          }
        }
        if (hits.length) await wait(40);
      }
      if (n !== e.count) { n = e.count; BidBanner.tick(n, state()); }
      await wait(120);
      const you = e.bidder === 0 ? 'bidder' : e.caller === 0 ? 'caller' : null;
      const loser = e.kind === 'liar' ? (e.good ? e.caller : e.bidder) : (e.exact ? -1 : e.caller);
      const nm = k => (k === 0 ? 'You' : first(TV.seats[k] ? TV.seats[k].id : ''));
      const sub = loser >= 0 ? `${nm(loser)} ${loser === 0 ? 'lose' : 'loses'} ${TV.rule === 'sudden' ? 'two dice' : 'a die'}` : `${nm(e.caller)} ${e.caller === 0 ? 'win' : 'wins'} a die back`;
      let text, kind;
      if (e.kind === 'spot' && e.exact) { text = 'DEAD ON'; kind = 'big'; }
      else if (e.kind === 'spot') { text = e.count > e.q ? 'TOO MANY' : 'SHORT'; kind = you === 'caller' ? 'danger' : 'accent'; }
      else if (e.good) { text = 'IT’S THERE'; kind = you === 'caller' ? 'danger' : 'good'; }
      else { text = you ? 'CAUGHT' : 'NOT THERE'; kind = you === 'caller' ? 'good' : 'danger'; }

  // =====================================================================
  // The engine's events, drawn in order. play(events) is the seam.
  // =====================================================================
  let bookShown = null; // the Book as it stood at the event being drawn (the Book on disk is already up to date)

  // The Count of a bid while the round is live; a plain count from what you know once the engine has moved past it.
  function countOf(q, f) {

  function infoLine() {

    async pay(e) {

    async trick(e) {

        case 'cornered': e.shown.forEach(x => { TV.peek.push({ seat: x.seat, i: x.die, face: x.face }); const s = seatOf(x.seat); if (s) s.renderTray(s.shown.concat([{ i: x.die, face: x.face, why: 'cornered' }])); }); Toast.show('Cornered: you see one die under every cup').catch(() => {}); return;

    async bid(e) {

  // ----- Fit: the table's content in the height it has -----

    toggleBook(on) { const s = $('screen-table'); const v = on === undefined ? !s.hasAttribute('data-book') : on; s.toggleAttribute('data-book', v); $('btn-bookside').querySelector('.booklbl').textContent = v ? 'Table' : 'Book'; $('btn-bookside').setAttribute('aria-label', v ? 'Back to the table' : 'The Book'); $('btn-bookside').setAttribute('aria-pressed', String(v)); if (v) Table.setPeople(); },

    /* A table: {hour, kind, rule, ante, buyIn, seats:[{seat, id, dice, start}]} */
    setup(t) {

          el('li', null, b('They read you back. '), 'Sharp players and the house watch how you raise (a step of one, a jump, a new face) and remember what your cup showed. Bluff the same way every time and they will call it. Your Book’s page, “What they know about you”, shows what they have. Poker Face hides it.'),
          // After the house (said only once it is earned).

          Ledger.data.house > 0 ? el('li', { id: 'rules-grudges' }, b('Grudges. '), 'A regular you knock out, or whose table you win, may come back on a later night: one a table, two a night at most. They bring half the buy-in more to the pot and call your bids sooner (only yours). Finish ahead of them for a quarter of the buy-in on top; either way it is over. Not met in five nights, it fades.') : null,
          Ledger.data.house > 0 ? el('li', { id: 'rules-starts' }, b('Ways to walk in. '), 'Each feat on Lyman’s ledger opens one: ' + Engine.STARTS.filter(x => x.id !== 'usual').map(x => `${x.name} (${x.line.replace(/\.$/, '')})`).join('; ') + '. Tonight’s tables take no room, no start and no grudges.') : null),
        el('p', { class: 'note' }, 'The Count is the chance the bid is true from your dice (and anything a trick shows you), the other dice fair. People are not fair. That is the game.')
